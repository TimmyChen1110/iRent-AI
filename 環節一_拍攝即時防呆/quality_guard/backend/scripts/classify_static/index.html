<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<title>視角分類器測試</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; font-family: -apple-system, "PingFang TC", sans-serif;
    background: #111; color: #eee; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; padding: 30px 16px;
  }
  h1 { font-size: 18px; color: #ccc; margin-bottom: 20px; }
  #drop {
    width: min(480px, 90vw); min-height: 220px; border: 2px dashed #444; border-radius: 12px;
    display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 10px;
    cursor: pointer; color: #888; text-align: center; padding: 16px; box-sizing: border-box;
  }
  #drop.drag { border-color: #5b9dff; color: #5b9dff; background: #16223a; }
  #drop img { max-width: 100%; max-height: 320px; border-radius: 8px; }
  input[type=file] { display: none; }
  #result { width: min(480px, 90vw); margin-top: 20px; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin: 8px 0; font-size: 14px; }
  .bar-label { width: 60px; text-align: right; color: #ccc; }
  .bar-track { flex: 1; background: #222; border-radius: 6px; overflow: hidden; height: 20px; }
  .bar-fill { height: 100%; background: #3a6fd8; }
  .bar-fill.top { background: #3fae5c; }
  .bar-pct { width: 54px; font-variant-numeric: tabular-nums; color: #aaa; }
  .headline { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
  .headline .conf { color: #7ed99a; }
  .loading { color: #888; font-size: 14px; }
</style>
</head>
<body>
  <h1>視角分類器測試(左前/右前/左後/右後)</h1>
  <div id="drop">
    <div id="drop-hint">點擊選擇圖片、把圖片拖進來、或直接貼上剪貼簿的圖片(Cmd+V)</div>
  </div>
  <input type="file" id="file-input" accept="image/*" />
  <div id="result"></div>

<script>
const drop = document.getElementById('drop');
const fileInput = document.getElementById('file-input');
const result = document.getElementById('result');

drop.addEventListener('click', () => fileInput.click());
drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('drag'); });
drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
drop.addEventListener('drop', (e) => {
  e.preventDefault();
  drop.classList.remove('drag');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files.length) handleFile(fileInput.files[0]);
});

document.addEventListener('paste', (e) => {
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      const file = item.getAsFile();
      if (file) {
        e.preventDefault();
        handleFile(file);
      }
      break;
    }
  }
});

function handleFile(file) {
  const url = URL.createObjectURL(file);
  drop.innerHTML = `<img src="${url}" />`;
  predict(file);
}

async function predict(file) {
  result.innerHTML = '<div class="loading">判斷中...</div>';
  const formData = new FormData();
  formData.append('file', file);
  try {
    const res = await fetch('/api/predict', { method: 'POST', body: formData });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    render(data);
  } catch (err) {
    result.innerHTML = `<div class="loading">失敗: ${err}</div>`;
  }
}

function render(data) {
  const bars = data.probabilities.map(p => {
    const pct = (p.probability * 100).toFixed(1);
    const isTop = p.label === data.predicted_label;
    return `
      <div class="bar-row">
        <div class="bar-label">${p.label}</div>
        <div class="bar-track"><div class="bar-fill ${isTop ? 'top' : ''}" style="width:${pct}%"></div></div>
        <div class="bar-pct">${pct}%</div>
      </div>`;
  }).join('');

  result.innerHTML = `
    <div class="headline">預測：${data.predicted_label} <span class="conf">(${(data.confidence * 100).toFixed(1)}%)</span></div>
    ${bars}
  `;
}
</script>
</body>
</html>
