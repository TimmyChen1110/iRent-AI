<title>iRent 車況監理台</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* 車隊監理台 — 深色營運 console，單一主題（刻意選擇；所有顏色皆明確上色） */
  :root {
    --bg: #0B100E;
    --panel: #111814;
    --panel2: #17211C;
    --panel3: #1D2A23;
    --line: #22312A;
    --line2: #2F443A;
    --ink: #E9F2EC;
    --muted: #8AA094;
    --faint: #5D7268;
    --acc: #3ADD8A;
    --acc-ink: #7FEBB4;
    --acc-soft: rgba(58, 221, 138, .10);
    --red: #FF6C5E;
    --red-soft: rgba(255, 108, 94, .12);
    --amber: #F0B054;
    --amber-soft: rgba(240, 176, 84, .12);
    --ok: #3ADD8A;
    --ok-soft: rgba(58, 221, 138, .10);
  }

  * { box-sizing: border-box; }
  html { scrollbar-gutter: stable; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", -apple-system, "Segoe UI", sans-serif;
    font-size: 16px; line-height: 1.65;
  }
  .mono, kbd, .plate { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
  .micro { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
  button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  button:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
  ::selection { background: rgba(58, 221, 138, .25); }

  /* ================= 頂列 ================= */
  .topbar {
    display: flex; align-items: center; gap: 22px; flex-wrap: wrap;
    padding: 10px 22px; background: var(--panel); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 30;
  }
  .brand { display: flex; align-items: center; gap: 11px; white-space: nowrap; }
  .brand .mark {
    width: 30px; height: 30px; border-radius: 4px; flex: none;
    background: var(--acc);
    display: grid; place-items: center;
  }
  .brand .mark svg { display: block; }
  .brand .t1 { font-weight: 800; font-size: 17.4px; letter-spacing: .01em; line-height: 1.25; }
  .brand .t1 .g { color: var(--acc); }
  .brand .t2 { font-size: 11.4px; font-weight: 700; letter-spacing: .22em; color: var(--faint); text-transform: uppercase; line-height: 1; }

  .tabs { display: flex; gap: 0; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .tab {
    padding: 7px 18px; font-weight: 700; font-size: 15.7px; color: var(--muted);
    display: flex; align-items: center; gap: 8px; border-right: 1px solid var(--line);
    background: var(--panel);
  }
  .tab:last-child { border-right: none; }
  .tab:hover { color: var(--ink); background: var(--panel2); }
  .tab[aria-selected="true"] { background: var(--panel3); color: var(--acc-ink); box-shadow: inset 0 -2px 0 var(--acc); }
  .tab .cnt { font-family: ui-monospace, Menlo, monospace; font-size: 13.2px; font-weight: 700; color: var(--faint); }
  .tab[aria-selected="true"] .cnt { color: var(--acc); }

  .top-right { margin-left: auto; display: flex; align-items: center; gap: 16px; white-space: nowrap; }
  .live { display: flex; align-items: center; gap: 7px; font-size: 13.8px; font-weight: 700; color: var(--muted); }
  .live .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 0 0 rgba(58,221,138,.5); animation: pulse 2.2s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(58,221,138,.45); } 70% { box-shadow: 0 0 0 7px rgba(58,221,138,0); } 100% { box-shadow: 0 0 0 0 rgba(58,221,138,0); } }
  .clock { font-family: ui-monospace, Menlo, monospace; font-size: 14.6px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .batch { font-family: ui-monospace, Menlo, monospace; font-size: 12.6px; letter-spacing: .08em; color: var(--faint); border: 1px solid var(--line); border-radius: 3px; padding: 3px 9px; }

  /* ================= 進度列（案件模式） ================= */
  .statsbar {
    display: flex; align-items: center; gap: 22px; flex-wrap: wrap;
    padding: 8px 22px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .statsbar:empty { display: none; }
  .progress { display: flex; align-items: center; gap: 10px; min-width: 240px; flex: 1; max-width: 420px; }
  .progress .lbl { font-size: 14.4px; font-weight: 700; white-space: nowrap; color: var(--muted); }
  .progress .track { flex: 1; height: 5px; border-radius: 2px; background: var(--panel3); overflow: hidden; }
  .progress .fill { height: 100%; background: var(--acc); transition: width .3s; }
  .progress .pct { font-size: 14.4px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .statpills { display: flex; gap: 14px; flex-wrap: wrap; }
  .spill { display: inline-flex; align-items: center; gap: 7px; font-size: 14.4px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .spill .dot { width: 7px; height: 7px; border-radius: 50%; }
  .spill.crit { color: var(--red); } .spill.crit .dot { background: var(--red); }
  .spill.warn { color: var(--amber); } .spill.warn .dot { background: var(--amber); }
  .spill.okp { color: var(--ok); } .spill.okp .dot { background: var(--ok); }

  /* ================= 主版面 ================= */
  .main { display: grid; grid-template-columns: 372px 1fr; gap: 16px; padding: 16px 22px 40px; align-items: start; }
  .main.full { grid-template-columns: 1fr; }
  .main.full .left { display: none; }
  @media (max-width: 940px) { .main { grid-template-columns: 1fr; } }

  /* ---------- 左欄 ---------- */
  .left { display: flex; flex-direction: column; gap: 10px; }
  .filters { display: flex; gap: 5px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line); background: var(--panel); color: var(--muted);
    border-radius: 3px; padding: 3px 11px; font-size: 14.4px; font-weight: 700;
  }
  .chip:hover { border-color: var(--line2); color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--acc); color: #06231A; border-color: var(--acc); }
  .chip .n { opacity: .65; margin-left: 5px; font-variant-numeric: tabular-nums; font-family: ui-monospace, Menlo, monospace; font-size: 13.2px; }

  .list { display: flex; flex-direction: column; gap: 6px; max-height: calc(100vh - 210px); overflow-y: auto; padding: 2px 2px 2px 0; }
  .item {
    display: grid; grid-template-columns: 52px 1fr auto; gap: 0 11px; align-items: center;
    text-align: left; width: 100%; flex: none;
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
    padding: 9px 11px 9px 14px; position: relative; overflow: hidden;
  }
  .item .stripe { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
  .item.lv-p1 .stripe { background: var(--red); }
  .item.lv-p2 .stripe { background: var(--amber); }
  .item.lv-p3 .stripe { background: var(--line2); }
  .item:hover { background: var(--panel2); border-color: var(--line2); }
  .item[aria-current="true"] { border-color: var(--acc); background: var(--panel2); }
  .item .thumb { width: 52px; height: 52px; border-radius: 3px; object-fit: cover; background: var(--panel3); display: block; }
  .item .mid { min-width: 0; }
  .item .t1 { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .item .plate { font-weight: 800; font-size: 16.2px; letter-spacing: .02em; }
  .item .angle { font-size: 13.8px; color: var(--muted); font-weight: 600; }
  .item .desc { display: block; font-size: 13.8px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .right { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
  .item .state { font-size: 15.1px; line-height: 1; color: var(--acc); }

  .badge {
    display: inline-flex; align-items: center; gap: 4px; border-radius: 3px; padding: 1.5px 7px;
    font-size: 12.6px; font-weight: 800; letter-spacing: .06em; white-space: nowrap;
    font-family: ui-monospace, Menlo, monospace;
  }
  .badge.p1 { background: var(--red-soft); color: var(--red); border: 1px solid var(--red); }
  .badge.p2 { background: var(--amber-soft); color: var(--amber); border: 1px solid var(--amber); }
  .badge.p3 { background: var(--ok-soft); color: var(--ok); border: 1px solid rgba(58,221,138,.4); }
  .badge.soft { background: var(--panel3); color: var(--muted); border: 1px solid var(--line2); font-weight: 700; }
  .badge.f2tag { background: var(--acc-soft); color: var(--acc-ink); border: 1px solid rgba(58,221,138,.35); font-weight: 700; }

  /* ---------- 右欄（詳情） ---------- */
  .detail { display: flex; flex-direction: column; gap: 13px; min-width: 0; }
  .d-card { background: var(--panel); border: 1px solid var(--line); border-radius: 5px; }

  .d-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 13px 16px; }
  .d-head .plate { font-size: 24.8px; font-weight: 800; letter-spacing: .02em; }
  .d-head .angle { font-size: 16.2px; font-weight: 700; color: var(--muted); }
  .d-head .spacer { flex: 1; }

  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    border-radius: 4px; padding: 7px 15px; font-weight: 800; font-size: 15.1px;
    border: 1px solid var(--line2); background: var(--panel2); color: var(--ink);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { background: var(--panel3); border-color: var(--faint); }
  .btn:disabled { opacity: .4; cursor: not-allowed; filter: grayscale(.6); }
  .btn.danger { background: var(--red); border-color: var(--red); color: #2A0B08; }
  .btn.danger:hover { filter: brightness(1.1); }

  .decided {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    border-radius: 4px; padding: 7px 13px; font-weight: 800; font-size: 15.1px; border: 1px solid;
  }
  .decided.confirm { background: var(--red-soft); color: var(--red); border-color: var(--red); }
  .decided.reject { background: var(--ok-soft); color: var(--ok); border-color: rgba(58,221,138,.5); }
  .decided.retake { background: var(--amber-soft); color: var(--amber); border-color: var(--amber); }
  .decided .undo { text-decoration: underline; font-weight: 700; font-size: 14.4px; color: inherit; opacity: .85; }

  .photos { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
  @media (max-width: 640px) { .photos { grid-template-columns: 1fr; } }
  .photo { overflow: hidden; border-radius: 5px; }
  .photo .cap {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 13px; font-size: 14.6px; font-weight: 800; border-bottom: 1px solid var(--line);
  }
  .photo .cap .t { color: var(--faint); font-weight: 600; font-size: 13.2px; }
  .photo .cap .before { color: var(--muted); }
  .photo .cap .after { color: var(--acc-ink); }
  .photo img { display: block; width: 100%; height: auto; }
  .imgwrap { position: relative; }
  .imgwrap.zoomable { cursor: crosshair; }
  .lens {
    position: absolute; width: 148px; height: 148px; border-radius: 50%;
    border: 2px solid var(--acc); box-shadow: 0 0 0 2px rgba(0,0,0,.5), 0 6px 18px rgba(0,0,0,.5);
    background-repeat: no-repeat; pointer-events: none; display: none; z-index: 5;
  }
  .zoom-hint { font-size: 13.2px; color: var(--faint); padding: 4px 13px 7px; }

  .annbox {
    position: absolute; border: 2.5px solid var(--red); border-radius: 3px;
    box-shadow: 0 0 0 1px rgba(0,0,0,.4); pointer-events: none;
    transition: box-shadow .15s, border-width .15s;
  }
  .annbox .n {
    position: absolute; top: -11px; left: -11px; width: 21px; height: 21px;
    background: var(--red); color: #2A0B08; border-radius: 50%;
    font-size: 14.4px; font-weight: 800; display: flex; align-items: center; justify-content: center;
    font-family: ui-monospace, Menlo, monospace;
  }
  .annbox.hot { border-width: 3.5px; box-shadow: 0 0 0 3px rgba(255,108,94,.4), 0 0 16px rgba(255,108,94,.55); }

  .verdict { padding: 15px 16px; }
  .verdict h3 { margin: 0 0 4px; font-size: 17.9px; display: flex; align-items: center; gap: 9px; }
  .verdict h3 .ico { font-size: 20.2px; }
  .verdict h3.crit { color: var(--red); }
  .verdict h3.warn { color: var(--amber); }
  .verdict h3.ok { color: var(--ok); }
  .v-sub { color: var(--muted); font-size: 14.6px; margin-bottom: 8px; }

  .dmg { border-top: 1px solid var(--line); padding: 10px 8px; margin: 0 -8px; }
  .dmg.linked { cursor: pointer; }
  .dmg.linked:hover { background: var(--panel2); }
  .dmg .l1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 800; font-size: 15.7px; }
  .dmg .num {
    display: inline-flex; width: 20px; height: 20px; border-radius: 50%;
    background: var(--red); color: #2A0B08; font-size: 13.8px; font-weight: 800;
    align-items: center; justify-content: center;
    font-family: ui-monospace, Menlo, monospace; flex: none;
  }
  .sev { font-size: 12px; font-weight: 800; border-radius: 3px; padding: 1px 6px; letter-spacing: .07em; font-family: ui-monospace, Menlo, monospace; }
  .sev.high { background: var(--red); color: #2A0B08; }
  .sev.medium { background: var(--amber); color: #2A1B05; }
  .sev.low { background: var(--panel3); color: var(--muted); }
  .conf { display: flex; align-items: center; gap: 8px; margin: 6px 0 4px; font-size: 13.8px; color: var(--muted); }
  .conf .track { flex: 0 1 170px; height: 4px; border-radius: 2px; background: var(--panel3); overflow: hidden; }
  .conf .fill { height: 100%; background: var(--acc); }
  .dmg .why { font-size: 14.6px; color: var(--muted); border-left: 2px solid var(--line2); padding-left: 10px; margin-top: 4px; }
  .note { margin-top: 10px; font-size: 14.4px; color: var(--muted); }
  .note b { color: var(--ink); }

  .kbd-hint { font-size: 13.8px; color: var(--faint); padding: 0 4px; }
  kbd { border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 3px; padding: 0 5px; font-size: 12.6px; background: var(--panel2); }

  /* ---------- 營運總覽 ---------- */
  .ops { display: flex; flex-direction: column; gap: 14px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 14px 16px 12px; }
  .kpi .num {
    font-family: ui-monospace, Menlo, monospace; font-size: 31.5px; font-weight: 800; line-height: 1.15;
    font-variant-numeric: tabular-nums; letter-spacing: -.01em;
  }
  .kpi .num .unit { font-size: 16.8px; color: var(--muted); font-weight: 700; margin-left: 2px; }
  .kpi .sub { font-size: 13.8px; color: var(--muted); margin-top: 3px; }
  .kpi.good .num { color: var(--acc); }
  .kpi.crit .num { color: var(--red); }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 15px 18px 16px; min-width: 0; }
  .panel .p-title { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .panel .p-title b { font-size: 16.2px; font-weight: 800; }
  .panel .p-title .micro { transform: translateY(-1px); }

  .ops-grid { display: grid; grid-template-columns: 3fr 2fr; gap: 14px; align-items: start; }
  @media (max-width: 980px) { .ops-grid { grid-template-columns: 1fr; } }

  .flow-wrap { overflow-x: auto; }
  .flow-svg { display: block; min-width: 660px; width: 100%; }
  .flow-svg text { font-family: "Noto Sans TC", "PingFang TC", sans-serif; }
  .flow-svg .nd { fill: var(--panel2); stroke: var(--line2); }
  .flow-svg .nd.hi { stroke: var(--acc); }
  .flow-svg .tt { fill: var(--ink); font-size: 12.5px; font-weight: 700; }
  .flow-svg .ts { fill: var(--muted); font-size: 10.5px; }
  .flow-svg .tn { fill: var(--acc-ink); font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; font-weight: 700; }
  .flow-svg .pipe { fill: none; stroke-linecap: round; }
  .flow-svg .pipe.base { stroke: var(--panel3); }
  .flow-svg .pipe.anim { stroke-dasharray: 1 14; animation: flowdash 1.1s linear infinite; }
  @keyframes flowdash { to { stroke-dashoffset: -15; } }
  @media (prefers-reduced-motion: reduce) {
    .flow-svg .pipe.anim { animation: none; stroke-dasharray: none; opacity: .55; }
    .live .pulse { animation: none; }
  }

  .hotcar { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
  @media (max-width: 560px) { .hotcar { grid-template-columns: 1fr; } }
  .hot-svg { display: block; width: 190px; margin: 0 auto; }
  .hot-svg .sil { fill: var(--panel2); stroke: var(--line2); stroke-width: 1.5; }
  .hot-svg .zn { stroke: rgba(255,108,94,.25); stroke-width: 1; rx: 4; }
  .hot-svg .zl { fill: var(--ink); font-family: ui-monospace, Menlo, monospace; font-size: 13px; font-weight: 800; text-anchor: middle; }
  .hbar { display: flex; align-items: center; gap: 9px; font-size: 14.6px; padding: 3px 0; }
  .hbar .hn { width: 86px; flex: none; color: var(--muted); font-weight: 700; text-align: right; }
  .hbar .track { flex: 1; height: 9px; background: var(--panel3); border-radius: 2px; overflow: hidden; }
  .hbar .fill { height: 100%; background: var(--red); border-radius: 2px; }
  .hbar .hv { font-family: ui-monospace, Menlo, monospace; font-size: 14.4px; color: var(--ink); width: 60px; }

  .dq { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .dq .cell { border: 1px solid var(--line); border-radius: 4px; padding: 11px 13px; background: var(--panel2); }
  .dq .big { font-family: ui-monospace, Menlo, monospace; font-size: 24.8px; font-weight: 800; }
  .dq .big.warn { color: var(--amber); }
  .dq .big.crit { color: var(--red); }
  .dq .big.good { color: var(--acc); }
  .dq .cap2 { font-size: 13.8px; color: var(--muted); margin-top: 2px; }
  .splitbar { display: flex; height: 9px; border-radius: 2px; overflow: hidden; margin: 8px 0 4px; }
  .splitbar span { display: block; height: 100%; }

  /* ---------- 車輛護照 ---------- */
  .p-layout { display: grid; grid-template-columns: 360px 1fr; gap: 0; }
  @media (max-width: 760px) { .p-layout { grid-template-columns: 1fr; } }
  .p-map { padding: 12px 12px 8px; border-right: 1px solid var(--line); }
  @media (max-width: 760px) { .p-map { border-right: none; border-bottom: 1px solid var(--line); } }
  .viz-toggle { display: flex; gap: 0; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; width: fit-content; margin: 0 auto 8px; }
  .viz-toggle button { padding: 3px 14px; font-size: 14.4px; font-weight: 800; color: var(--muted); background: var(--panel); }
  .viz-toggle button + button { border-left: 1px solid var(--line); }
  .viz-toggle button[aria-pressed="true"] { background: var(--panel3); color: var(--acc-ink); }
  #carviz { position: relative; }
  #carviz canvas { display: block; margin: 0 auto; border-radius: 5px; cursor: grab; touch-action: none; }
  #carviz canvas:active { cursor: grabbing; }
  .viz-hint { text-align: center; font-size: 13.2px; color: var(--faint); margin-top: 2px; }
  .p-recs { padding: 13px 16px; }
  .car-svg { display: block; max-width: 300px; margin: 0 auto; }
  .car-svg .zone { fill: var(--panel2); stroke: var(--line); }
  .car-svg .zlbl { fill: var(--muted); font-size: 13px; }
  .car-body { fill: var(--panel3); stroke: var(--muted); stroke-width: 2; stroke-linejoin: round; }
  .car-glass { fill: var(--line); stroke: var(--muted); stroke-width: 1; }
  .car-wheel { fill: var(--muted); }
  .car-line { stroke: var(--line2); stroke-width: 1.5; fill: none; }
  .car-lamp { fill: var(--amber-soft); stroke: var(--muted); stroke-width: 1; }
  .car-tail { fill: var(--red-soft); stroke: var(--muted); stroke-width: 1; }
  .dot { cursor: pointer; }
  .dot circle { stroke: var(--bg); stroke-width: 1.5; }
  .dot.new circle { fill: var(--red); }
  .dot.pre circle { fill: var(--faint); }
  .dot text { fill: var(--bg); font-size: 12px; font-weight: 800; }
  .dot.hot circle { r: 13; filter: drop-shadow(0 0 6px rgba(255,108,94,.8)); }
  .rec { border-top: 1px solid var(--line); padding: 10px 8px; margin: 0 -8px; }
  .rec:hover, .rec.hot { background: var(--panel2); }
  .rec .l1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 800; font-size: 15.1px; }
  .rec .meta { font-size: 14.4px; color: var(--muted); margin-top: 3px; }
  .rec .meta b { color: var(--ink); font-weight: 700; }
  .evlink { color: var(--acc-ink); font-weight: 800; font-size: 14.4px; cursor: pointer; }
  .evlink:hover { text-decoration: underline; }
  .orders { margin-top: 12px; font-size: 14.4px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
  .orders .mono { color: var(--ink); }

  .parts-table { width: 100%; border-collapse: collapse; font-size: 14.6px; }
  .parts-table th { padding: 5px 8px; text-align: left; color: var(--faint); font-size: 12.6px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
  .parts-table td { padding: 6px 8px; border-top: 1px solid var(--line); }

<script>
/* ================= 資料整備 ================= */
F2CASES.forEach(c => CASES.push(c));
{ const ord = { P1: 0, P2: 1, P3: 2 }; CASES.sort((a, b) => ord[a.level] - ord[b.level]); }
const ANN = (typeof ANNOTATIONS !== "undefined") ? ANNOTATIONS : {};
const PASSPORTS = (typeof PASSPORT_DATA !== "undefined") ? PASSPORT_DATA : {};

/* 實測 KPI（來源：analyze_autopass.py / quality_gate.py / cleanliness_score.py / photo_chain.py） */
const OPS = {
  photos: 27367, orders: 4820, recall: 100, fpr: 0.85,
  autoPass: 83.0, alert: 15.6, human: 1.4, gate: 9.2, escalate: 2.8,
  interiorReal: 24, interiorMis: 56, chainCars: 1126, chainScanned: 15, chainHits: 1,
};

/* server 版（uvicorn server:app）注入 SERVER_MODE=true：照片走 /photos/ URL、複核決策全隊共享 */
const SERVER = (typeof SERVER_MODE !== "undefined") && SERVER_MODE;
function imgSrc(v) { return v && v.startsWith("/photos/") ? v : "data:image/jpeg;base64," + v; }

const LS_KEY = "irent-review-demo-v1";
let decisions = {};
async function loadDecisions() {
  if (SERVER) {
    try { decisions = await (await fetch("/api/decisions")).json(); } catch (e) { decisions = {}; }
  } else {
    try { decisions = JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch (e) {}
  }
}
let filter = "all";
let currentId = null;
let viewMode = "ops";
let currentCar = null;
let passportViz = "3d";
try { passportViz = localStorage.getItem("irent-passport-viz") || "3d"; } catch (e) {}
if (typeof THREE === "undefined") passportViz = "2d";

const LEVEL_META = {
  P1: { label: "P1 即時預警", ico: "⚠" },
  P2: { label: "P2 工單", ico: "◐" },
  P3: { label: "P3 正常", ico: "✓" },
};
const DECISION_META = {
  confirm: { cls: "confirm", ico: "✓", label: "已確認 — 進入索賠／清潔調度，附照片證據鏈" },
  reject:  { cls: "reject",  ico: "✕", label: "已駁回誤報 — 回寫為訓練樣本" },
  retake:  { cls: "retake",  ico: "⟳", label: "已要求補件 — 已推播用戶補拍" },
};

function save() { if (!SERVER) localStorage.setItem(LS_KEY, JSON.stringify(decisions)); }
function counts() {
  const c = { all: CASES.length, P1: 0, P2: 0, P3: 0, done: 0 };
  for (const cs of CASES) { c[cs.level]++; if (decisions[cs.id]) c.done++; }
  return c;
}

/* ================= 頂部：時鐘 + 分頁 + 進度 ================= */
function tickClock() {
  const el = document.getElementById("clock");
  if (el) el.textContent = new Date().toLocaleTimeString("zh-TW", { hour12: false });
}
setInterval(tickClock, 1000); tickClock();

function renderTabs() {
  document.getElementById("tabs").innerHTML = `
    <button class="tab" role="tab" aria-selected="${viewMode === "ops"}" onclick="setMode('ops')">營運總覽</button>
    <button class="tab" role="tab" aria-selected="${viewMode === "cases"}" onclick="setMode('cases')">案件複核<span class="cnt">${CASES.length}</span></button>
    <button class="tab" role="tab" aria-selected="${viewMode === "passport"}" onclick="setMode('passport')">車輛損傷護照<span class="cnt">${Object.keys(PASSPORTS).length}</span></button>
    <button class="tab" role="tab" aria-selected="${viewMode === "live"}" onclick="setMode('live')">現場實測<span class="cnt">LIVE</span></button>`;
}

function renderStats() {
  const bar = document.getElementById("statsbar");
  if (viewMode !== "cases") { bar.innerHTML = ""; return; }
  const c = counts();
  const pct = Math.round(c.done / c.all * 100);
  bar.innerHTML = `
    <div class="progress">
      <span class="lbl">複核進度</span>
      <div class="track"><div class="fill" style="width:${pct}%"></div></div>
      <span class="pct mono">${c.done}/${c.all}（${pct}%）</span>
    </div>
    <div class="statpills">
      <span class="spill crit"><span class="dot"></span>P1 即時預警 ${c.P1}</span>
      <span class="spill warn"><span class="dot"></span>P2 工單 ${c.P2}</span>
      <span class="spill okp"><span class="dot"></span>P3 正常 ${c.P3}</span>
      ${labelPill()}
    </div>`;
}

/* 訓練標籤累積：每一次複核裁決都會存成 ground truth（邊際成本為零），
   累積數月後即為訓練 CV 模型的資料集。讓這件事在後台看得見。 */
let LABELS = null;
function labelPill() {
  if (!SERVER || !LABELS) return "";
  const d = LABELS.ai_disagreed;
  const agree = LABELS.ai_agreement == null ? "—" : (LABELS.ai_agreement * 100).toFixed(0) + "%";
  return `<span class="spill" title="每次裁決都會存成訓練標籤（照片路徑＋AI判定＋人工真值）。\n匯出：python3 pipeline/export_training_labels.py">
      <span class="dot" style="background:var(--accent,#6ea8fe)"></span>訓練標籤 ${LABELS.labeled_cases}
      <span style="opacity:.7">（正 ${LABELS.positive}／AI 一致 ${agree}${d ? `／難例 ${d}` : ""}）</span>
    </span>`;
}
async function refreshLabels() {
  if (!SERVER) return;
  try { LABELS = await (await fetch("/api/labels/stats")).json(); } catch (e) { LABELS = null; }
}

/* ================= 左欄 ================= */
function renderFilters() {
  const el = document.getElementById("filters");
  if (viewMode !== "cases") { el.innerHTML = ""; return; }
  const c = counts();
  const f2n = CASES.filter(cs => cs.f2).length;
  const liveN = CASES.filter(cs => cs.live).length;
  const defs = [
    ["all", "全部", c.all], ["P1", "P1", c.P1], ["P2", "P2", c.P2], ["P3", "P3", c.P3],
    ["f2", "車內", f2n],
    ...(liveN ? [["live", "現場", liveN]] : []),
    ["todo", "未複核", c.all - c.done], ["done", "已複核", c.done],
  ];
  el.innerHTML = defs.map(([k, lbl, n]) =>
    `<button class="chip" aria-pressed="${filter === k}" onclick="setFilter('${k}')">${lbl}<span class="n">${n}</span></button>`).join("");
}

function visible() {
  return CASES.filter(cs => {
    if (filter === "all") return true;
    if (filter === "done") return !!decisions[cs.id];
    if (filter === "todo") return !decisions[cs.id];
    if (filter === "f2") return !!cs.f2;
    if (filter === "live") return !!cs.live;
    return cs.level === filter;
  });
}

function summaryText(cs) {
  const a = cs.assessment;
  if (cs.f2) {
    if (a.level === "髒汙") return "髒汙：" + (a.issues.join("、") || a.reasoning);
    return `${a.level} — ${a.reasoning}`;
  }
  if (!a.angle_match) return "借/還照方位不一致，無法比對";
  if (!a.new_damage_found) return "未發現新增車損";
  return a.damages.map(d => `${d.location}·${d.type}`).join("；");
}

function renderList() {
  if (viewMode === "passport") { renderPassportList(); return; }
  if (viewMode !== "cases") return;
  const vis = visible();
  if (vis.length && !vis.some(cs => cs.id === currentId)) currentId = vis[0].id;
  document.getElementById("list").innerHTML = vis.map(cs => {
    const d = decisions[cs.id];
    const thumb = cs.f2 ? cs.photo : cs.ret;
    return `<button class="item lv-${cs.level.toLowerCase()}" aria-current="${cs.id === currentId}" onclick="selectCase('${cs.id}')">
      <span class="stripe"></span>
      <img class="thumb" src="${imgSrc(thumb)}" alt="" loading="lazy">
      <span class="mid">
        <span class="t1"><span class="plate">${cs.car}</span><span class="angle">${cs.angle}</span>
          ${cs.f2 ? `<span class="badge f2tag">車內</span>` : ""}${cs.live ? `<span class="badge f2tag">現場</span>` : ""}</span>
        <span class="desc">${summaryText(cs)}</span>
      </span>
      <span class="right">
        <span class="badge ${cs.level.toLowerCase()}">${cs.level}</span>
        <span class="state">${d ? DECISION_META[d].ico : ""}</span>
      </span>
    </button>`;
  }).join("") || `<div style="padding:20px;color:var(--muted)">此篩選下沒有案件</div>`;
  scrollCurrentIntoView();

function scrollCurrentIntoView() {
  const el = document.querySelector('.item[aria-current="true"]');
  if (el) el.scrollIntoView({ block: "nearest" });
}

/* ================= 標註疊加 ================= */
function confBar(v) {
  return `<div class="conf"><span>信心</span><div class="track"><div class="fill" style="width:${Math.round(v * 100)}%"></div></div><span class="mono">${v.toFixed(2)}</span></div>`;
}
function annBoxes(cs) {
  const a = ANN[cs.id];
  if (!a || !a.findings.length) return "";
  return a.findings.map((f, i) => {
    const [y0, x0, y1, x1] = f.box_2d;
    return `<div class="annbox" id="ab${i}" style="left:${x0 / 10}%;top:${y0 / 10}%;width:${(x1 - x0) / 10}%;height:${(y1 - y0) / 10}%"><span class="n">${i + 1}</span></div>`;
  }).join("");
}
function annRows(cs) {
  const a = ANN[cs.id];
  if (!a || !a.findings.length) return null;
  return a.findings.map((f, i) => `
    <div class="dmg linked" onmouseenter="hotBox(${i},true)" onmouseleave="hotBox(${i},false)">
      <div class="l1"><span class="num">${i + 1}</span>${f.label}<span class="sev ${f.severity}">${f.severity.toUpperCase()}</span></div>
      ${confBar(f.confidence)}
      <div class="why">${f.description}</div>
    </div>`).join("");
}
function hotBox(i, on) {
  const el = document.getElementById("ab" + i);
  if (el) el.classList.toggle("hot", on);
}

/* ================= 同步放大鏡（借/還照同座標比對） ================= */
const ZOOM = 2.3;
function lensMove(e) {
  const wrap = e.currentTarget;
  const zone = wrap.closest(".photos");
  if (!zone) return;
  const img = wrap.querySelector("img");
  const r = img.getBoundingClientRect();
  const fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
  zone.querySelectorAll(".imgwrap.zoomable").forEach(w => {
    const im = w.querySelector("img"), ln = w.querySelector(".lens");
    if (!im || !ln) return;
    const rw = im.clientWidth, rh = im.clientHeight;
    const lw = ln.offsetWidth, lh = ln.offsetHeight;
    const cx = fx * rw, cy = fy * rh;
    ln.style.display = "block";
    ln.style.left = (cx - lw / 2) + "px";
    ln.style.top = (cy - lh / 2) + "px";
    ln.style.backgroundImage = `url("${im.src}")`;
    ln.style.backgroundSize = (rw * ZOOM) + "px " + (rh * ZOOM) + "px";
    ln.style.backgroundPosition = (-(cx * ZOOM - lw / 2)) + "px " + (-(cy * ZOOM - lh / 2)) + "px";
  });
}
function lensLeave(e) {
  const zone = e.currentTarget.closest(".photos");
  if (zone) zone.querySelectorAll(".lens").forEach(l => l.style.display = "none");
}
function armLens() {
  if (window.matchMedia && window.matchMedia("(pointer: coarse)").matches) return;
  document.querySelectorAll(".photos .imgwrap.zoomable").forEach(w => {
    if (!w.querySelector(".lens")) {

let opsAnimated = false;
function countUp(el, target, decimals, suffix) {
  const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduced || opsAnimated) { el.textContent = target.toLocaleString("en-US", { minimumFractionDigits: decimals, maximumFractionDigits: decimals }) + (suffix || ""); return; }
  const t0 = performance.now(), dur = 900;
  (function step(t) {
    const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    el.textContent = (target * e).toLocaleString("en-US", { minimumFractionDigits: decimals, maximumFractionDigits: decimals }) + (suffix || "");
    if (p < 1) requestAnimationFrame(step);
  })(t0);
}

/* ================= 3D 車（Three.js，內嵌無外連） ================= */
let T3 = null;

function roundedShape(w, l, r) {
  const s = new THREE.Shape(), hw = w / 2, hl = l / 2;
  s.moveTo(-hw + r, -hl);
  s.lineTo(hw - r, -hl); s.quadraticCurveTo(hw, -hl, hw, -hl + r);
  s.lineTo(hw, hl - r); s.quadraticCurveTo(hw, hl, hw - r, hl);
  s.lineTo(-hw + r, hl); s.quadraticCurveTo(-hw, hl, -hw, hl - r);
  s.lineTo(-hw, -hl + r); s.quadraticCurveTo(-hw, -hl, -hw + r, -hl);
  return s;
}
function extrudeRounded(w, l, h, r, bevel) {
  const g = new THREE.ExtrudeGeometry(roundedShape(w, l, r), {
    depth: h, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 3, curveSegments: 12,
  });
  g.rotateX(-Math.PI / 2);
  return g;
}

function buildCar() {
  const car = new THREE.Group();
  const paint = new THREE.MeshStandardMaterial({ color: 0xf2f4f2, roughness: 0.32, metalness: 0.18 });
  const glass = new THREE.MeshStandardMaterial({ color: 0x1d2b26, roughness: 0.12, metalness: 0.65 });
  const dark = new THREE.MeshStandardMaterial({ color: 0x2b302d, roughness: 0.85 });
  const hubM = new THREE.MeshStandardMaterial({ color: 0x9aa5a0, roughness: 0.35, metalness: 0.6 });

  const body = new THREE.Mesh(extrudeRounded(1.62, 4.0, 0.36, 0.5, 0.1), paint);
  body.position.y = 0.3; car.add(body);
  const skirt = new THREE.Mesh(extrudeRounded(1.56, 3.9, 0.1, 0.48, 0.05), dark);
  skirt.position.y = 0.22; car.add(skirt);
  const cabin = new THREE.Mesh(extrudeRounded(1.34, 2.05, 0.3, 0.5, 0.13), glass);
  cabin.position.set(0, 0.78, -0.18); car.add(cabin);
  const roof = new THREE.Mesh(extrudeRounded(1.16, 1.6, 0.05, 0.42, 0.06), paint);
  roof.position.set(0, 1.13, -0.18); car.add(roof);

  const wheelG = new THREE.CylinderGeometry(0.335, 0.335, 0.24, 24);
  wheelG.rotateZ(Math.PI / 2);
  const hubG = new THREE.CylinderGeometry(0.17, 0.17, 0.26, 16);
  hubG.rotateZ(Math.PI / 2);
  for (const [x, z] of [[-0.78, 1.28], [0.78, 1.28], [-0.78, -1.28], [0.78, -1.28]]) {
    const w = new THREE.Mesh(wheelG, dark); w.position.set(x, 0.335, z); car.add(w);
    const h = new THREE.Mesh(hubG, hubM); h.position.set(x, 0.335, z); car.add(h);
  }
  const lampG = new THREE.BoxGeometry(0.36, 0.09, 0.06);
  const lampM = new THREE.MeshStandardMaterial({ color: 0xfff6d8, emissive: 0xffedb0, emissiveIntensity: 0.9 });
  const tailM = new THREE.MeshStandardMaterial({ color: 0xd7423c, emissive: 0xc03530, emissiveIntensity: 0.8 });
  for (const x of [-0.48, 0.48]) {
    const hl = new THREE.Mesh(lampG, lampM); hl.position.set(x, 0.5, 2.0); car.add(hl);
    const tl = new THREE.Mesh(lampG, tailM); tl.position.set(x, 0.5, -2.0); car.add(tl);
  }
  return car;
}

function markerTexture(num, color) {
  const c = document.createElement("canvas"); c.width = c.height = 96;
  const x = c.getContext("2d");
  x.beginPath(); x.arc(48, 48, 40, 0, 7); x.fillStyle = color; x.fill();
  x.lineWidth = 6; x.strokeStyle = "#fff"; x.stroke();
  x.fillStyle = "#fff"; x.font = "800 40px ui-monospace, Menlo, monospace";
  x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(num, 48, 51);
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4;
  return t;
}

/* 車頭朝 +Z、車輛左側為 +X（與 GLB 模型的 wheel-front-left 座標一致） */
const ZONE3D = { "左前": [1.02, 1.15], "右前": [-1.02, 1.15], "左後": [1.02, -1.05], "右後": [-1.02, -1.05] };

/* 真實車輛模型（Kenney Car Kit hatchback，CC0）：黏土灰 + 線框覆層。
   載入失敗時保留程式拼建的低多邊形車。 */
function loadCarModel(carGroup) {
  if (typeof CAR_GLB_B64 === "undefined" || typeof THREE.GLTFLoader === "undefined") return;
  let buf;
  try {
    const bin = atob(CAR_GLB_B64);
    buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  } catch (e) { return; }
  new THREE.GLTFLoader().parse(buf.buffer, "", gltf => {
    const sc = gltf.scene;
    const box = new THREE.Box3().setFromObject(sc);
    const size = box.getSize(new THREE.Vector3());
    sc.scale.setScalar(4.0 / size.z);                       // 車長正規化為 4（配合標記座標）
    box.setFromObject(sc);
    const c = box.getCenter(new THREE.Vector3());
    sc.position.set(-c.x, -box.min.y, -c.z);
    const clay = new THREE.MeshStandardMaterial({
      color: 0xb7bdb9, roughness: 0.55, metalness: 0.05,
      polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1,
    });
    const wire = new THREE.MeshBasicMaterial({ color: 0x4d5852, wireframe: true, transparent: true, opacity: 0.22 });
    const meshes = [];
    sc.traverse(o => { if (o.isMesh) meshes.push(o); });
    meshes.forEach(o => { o.material = clay; o.add(new THREE.Mesh(o.geometry, wire)); });
    carGroup.clear();
    carGroup.add(sc);
  }, () => {});
}

function initThree() {
  if (T3) return true;
  if (typeof THREE === "undefined") return false;
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  } catch (e) { return false; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(30, 1.18, 0.1, 60);
  camera.position.set(5.0, 3.3, 6.1); camera.lookAt(0, 0.45, 0);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x4a5850, 1.15));
  const dir = new THREE.DirectionalLight(0xffffff, 0.65); dir.position.set(3, 6, 4); scene.add(dir);
  const rim = new THREE.DirectionalLight(0xa8e2c6, 0.3); rim.position.set(-4, 2, -3); scene.add(rim);

  const root = new THREE.Group(); scene.add(root);
  const carGroup = new THREE.Group();
  carGroup.add(buildCar());        // 先放程式拼建車，GLB 載入成功後替換
  root.add(carGroup);
  loadCarModel(carGroup);
  const shadow = new THREE.Mesh(new THREE.CircleGeometry(1, 40),
    new THREE.MeshBasicMaterial({ color: 0x10241a, transparent: true, opacity: 0.16, depthWrite: false }));
  shadow.scale.set(1.35, 2.5, 1); shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.005;
  root.add(shadow);
  const markers = new THREE.Group(); root.add(markers);

  const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  T3 = { renderer, scene, camera, root, markers, rotY: 0.12, targetY: 0.12, rotX: 0.0, targetX: 0.0,
         auto: !reduced, lastTouch: 0, hovered: -1, ray: new THREE.Raycaster(), ptr: new THREE.Vector2() };

  const el = renderer.domElement;
  let dragging = false, px = 0, py = 0;
  el.addEventListener("pointerdown", e => { dragging = true; px = e.clientX; py = e.clientY; T3.lastTouch = Date.now(); el.setPointerCapture(e.pointerId); });
  el.addEventListener("pointerup", () => { dragging = false; });
  el.addEventListener("pointermove", e => {
    T3.lastTouch = Date.now();
    if (dragging) {
      T3.targetY += (e.clientX - px) * 0.009;
      T3.targetX = Math.max(-0.15, Math.min(0.55, T3.targetX + (e.clientY - py) * 0.005));
      px = e.clientX; py = e.clientY;
    } else {
      const r = el.getBoundingClientRect();
      T3.ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
      T3.ray.setFromCamera(T3.ptr, T3.camera);
      const hit = T3.ray.intersectObjects(T3.markers.children)[0];
      const idx = hit ? hit.object.userData.idx : -1;
      if (idx !== T3.hovered) {
        if (T3.hovered >= 0) hotRec(T3.hovered, false);
        if (idx >= 0) hotRec(idx, true);
        T3.hovered = idx;
        el.style.cursor = idx >= 0 ? "pointer" : "grab";
      }
    }
  });
  el.addEventListener("pointerleave", () => { if (T3.hovered >= 0) { hotRec(T3.hovered, false); T3.hovered = -1; } });

  (function loop() {
    requestAnimationFrame(loop);
    if (!T3.renderer.domElement.isConnected) return;   // 本幀跳過（RAF 已排下一幀）
    if (T3.auto && Date.now() - T3.lastTouch > 2600) T3.targetY += 0.0035;
    T3.rotY += (T3.targetY - T3.rotY) * 0.12;
    T3.rotX += (T3.targetX - T3.rotX) * 0.12;
    T3.root.rotation.y = T3.rotY;
    T3.root.rotation.x = T3.rotX * 0.4;
    T3.renderer.render(T3.scene, T3.camera);
  })();
  return true;
}

function mount3D(p) {
  const box = document.getElementById("carviz");
  if (!box) return;
  if (!initThree()) { passportViz = "2d"; box.innerHTML = carSvg(p); return; }
  // 重建標記
  T3.markers.children.slice().forEach(m => { T3.markers.remove(m); if (m.material.map) m.material.map.dispose(); m.material.dispose(); });
  const zoneCount = {};
  p.records.forEach((r, i) => {
    if (!ZONE3D[r.angle]) return;
    const n = zoneCount[r.angle] = (zoneCount[r.angle] || 0) + 1;
    const [x, z] = ZONE3D[r.angle];
    const isNew = r.kind !== "pre_existing";   // chain 亦屬新損，標紅
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({
      map: markerTexture(String(parseInt(r.id.slice(2), 10)), isNew ? "#FF6C5E" : "#6b7770"),
      depthTest: false, transparent: true,
    }));
    sp.scale.set(0.42, 0.42, 1);
    sp.position.set(x, 0.62 + (n - 1) * 0.42, z * (1 - (n - 1) * 0.12));
    sp.userData.idx = i;
    T3.markers.add(sp);
  });
  const w = Math.min(box.clientWidth || 330, 340), h = Math.round(w * 0.85);
  T3.renderer.setSize(w, h);
  T3.camera.aspect = w / h; T3.camera.updateProjectionMatrix();
  box.innerHTML = ""; box.appendChild(T3.renderer.domElement);
  T3.lastTouch = 0;
}

function jumpToCase(id) { viewMode = "cases"; filter = "all"; currentId = id; renderAll(); }

/* ================= 現場實測（任意照片即時判定，需 server 版） ================= */
const LIVE = { mode: "pair", files: {}, urls: {}, busy: false, result: null, error: null, t0: 0, timer: null };

/* --- 現場判定 → 案件佇列（存 SQLite，全隊共享） --- */
const liveLoaded = new Set();
function addLiveCase(payload) {
  if (liveLoaded.has(payload.case.id)) return;
  liveLoaded.add(payload.case.id);
  ANN[payload.case.id] = payload.ann;
  CASES.unshift(payload.case);
}
function removeLiveCaseLocal(id) {
  liveLoaded.delete(id); delete ANN[id]; delete decisions[id];
  const i = CASES.findIndex(c => c.id === id);
  if (i >= 0) CASES.splice(i, 1);
  if (currentId === id) currentId = null;
}
async function loadLiveCases() {
  if (!SERVER) return;
  try {
    const list = await (await fetch("/api/live_cases")).json();
    list.reverse().forEach(p => addLiveCase(p)); // 最新的最後 unshift → 排最上面
  } catch (e) {}
}
async function syncLiveCases() { // 5 秒輪詢：隊友新增/刪除的現場案件
  try {
    const ids = await (await fetch("/api/live_cases?ids=1")).json();
    const idSet = new Set(ids);
    let changed = false;
    for (const id of [...liveLoaded]) if (!idSet.has(id)) { removeLiveCaseLocal(id); changed = true; }
    if (ids.some(id => !liveLoaded.has(id))) { await loadLiveCases(); changed = true; }
    return changed;
  } catch (e) { return false; }
}
async function saveLiveCase(btn) {
  btn.disabled = true; btn.textContent = "存入中…";
  try {
    const r = await fetch("/api/live_case", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ judge_id: LIVE.result.judge_id }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || "存入失敗");
    addLiveCase(j);
    jumpToCase(j.case.id); // 直接跳到案件複核 → 閉環：現場判定 → 佇列 → 人工複核
  } catch (e) { btn.disabled = false; btn.textContent = "⊕ 存入案件佇列"; alert(e.message || e); }
}
async function deleteLiveCase(id) {
  if (!confirm("刪除此現場實測案件？（全隊都會移除）")) return;
  try { await fetch("/api/live_case/" + encodeURIComponent(id), { method: "DELETE" }); } catch (e) {}
  removeLiveCaseLocal(id);
  renderAll();
}

function setLiveMode(m) { LIVE.mode = m; LIVE.result = null; LIVE.error = null; LIVE.gate = null; renderLive(); }
function liveSet(k, file) {
  if (!file || !file.type.startsWith("image/")) return;
  if (LIVE.urls[k]) URL.revokeObjectURL(LIVE.urls[k]);
  LIVE.files[k] = file; LIVE.urls[k] = URL.createObjectURL(file);
  LIVE.result = null; LIVE.error = null; LIVE.gate = null; renderLive();
}
function liveFile(input, k) { liveSet(k, input.files[0]); }
function liveDrop(e, k) { e.preventDefault(); e.currentTarget.classList.remove("over"); liveSet(k, e.dataTransfer.files[0]); }
function liveReset() {
  Object.values(LIVE.urls).forEach(u => URL.revokeObjectURL(u));
  LIVE.files = {}; LIVE.urls = {}; LIVE.result = null; LIVE.error = null; LIVE.gate = null; renderLive();
}

function liveFormData() {
  const fd = new FormData();
  fd.append("mode", LIVE.mode);
  if (LIVE.mode === "pair") { fd.append("pickup", LIVE.files.pickup); fd.append("ret", LIVE.files.ret); }
  else fd.append("interior", LIVE.files.interior);
  return fd;
}

async function runLiveJudge(skipGate) {
  LIVE.result = null; LIVE.error = null; LIVE.t0 = Date.now();
  try {
    // 段 1：Quality Gate（純 CV、<1 秒）先回，立刻把品質卡片畫出來
    if (!skipGate) {
      LIVE.gate = null; LIVE.busy = "gate"; renderLive();
      const rg = await fetch("/api/gate", { method: "POST", body: liveFormData() });
      const g = await rg.json();
      if (!rg.ok) throw new Error(g.detail || "品質檢核失敗");
      LIVE.gate = g;
      if (!g.gate_pass) { LIVE.busy = false; renderLive(); return; } // 擋下 → 顯示重拍原因＋強制判定
    } else if (!LIVE.gate) {
      LIVE.gate = null; // 強制判定但沒 gate 結果（不該發生），照常續跑
    }
    // 段 2：AI 判定（gate 已看過 → skip_gate 續跑，完整 gate 數值仍會回在結果裡）
    LIVE.busy = "judge"; renderLive();
    LIVE.timer = setInterval(() => {
      const el = document.getElementById("live-elapsed");
      if (el) el.textContent = ((Date.now() - LIVE.t0) / 1000).toFixed(0) + " 秒";
    }, 500);
    const fd = liveFormData();
    fd.append("skip_gate", "true");
    const r = await fetch("/api/judge", { method: "POST", body: fd });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || "判定失敗");
    LIVE.result = j;
  } catch (e) { LIVE.error = String(e.message || e); }
  clearInterval(LIVE.timer);
  LIVE.busy = false; renderLive();
}

function liveGateHtml(j) {
  const names = { pickup: "借車照", return: "還車照", photo: "車內照" };
  return `<div class="gate-grid">` + Object.entries(j.gate).map(([k, g]) => `
    <div class="gate-card">
      <div class="g-head"><span>${names[k] || k}</span><span style="color:${g.pass ? "var(--ok)" : "var(--red)"}">${g.pass ? "✓ 通過" : "✗ 未通過"}</span></div>
      <div class="g-m">清晰度 ${g.sharpness} ・ 亮度 ${g.brightness} ・ 過曝 ${(g.highlight_clip * 100).toFixed(1)}%</div>
      ${g.reasons.map(r => `<div class="g-bad">${r}</div>`).join("")}
    </div>`).join("") + `</div>`;
}

function liveVerdictHtml(j) {
  const a = j.final;
  let head, sub, rows = "";
  if (j.mode === "interior") {
    if (a.level === "髒汙") { head = `<h3 class="crit"><span class="ico">⚠</span>髒汙 — 須立即清潔</h3>`; sub = "建議：該車暫停派單，通知清潔調度優先處理。"; }
    else if (a.level === "乾淨") { head = `<h3 class="ok"><span class="ico">✓</span>乾淨</h3>`; sub = "狀態良好，可回饋用戶信譽加分。"; }
    else { head = `<h3 class="ok"><span class="ico">✓</span>普通</h3>`; sub = "輕微使用痕跡，納入清潔排程權重。"; }
    rows = confBar(a.confidence) + (a.findings || []).map((f, i) => `
      <div class="dmg"><div class="l1"><span class="num">${i + 1}</span>${f.label}<span class="sev ${f.severity}">${f.severity.toUpperCase()}</span></div>
        ${confBar(f.confidence)}<div class="why">${f.description}</div></div>`).join("")
      + `<div class="dmg"><div class="why">${a.reasoning}</div></div>`;
  } else if (!a.angle_match) {
    head = `<h3 class="warn"><span class="ico">◐</span>無法有效比對</h3>`;
    sub = "兩張照片非同一方位或損傷部位未入鏡 — 請改用同一方位的兩張照片。";
  } else if (a.new_damage_found) {
    head = `<h3 class="crit"><span class="ico">⚠</span>偵測到新增車損</h3>`;
    sub = "以下損傷存在於還車照、但借車照對應位置無此痕跡：";
    rows = a.damages.map((d, i) => `
      <div class="dmg"><div class="l1"><span class="num">${i + 1}</span>${d.location} · ${d.type}<span class="sev ${d.severity}">${d.severity.toUpperCase()}</span></div>
        ${confBar(d.confidence)}<div class="why">${d.reasoning}</div></div>`).join("");
  } else {
    head = `<h3 class="ok"><span class="ico">✓</span>未發現新增車損</h3>`;
    sub = "借/還照比對一致。";
    rows = confBar(a.no_damage_confidence);
  }
  const pre = a.pre_existing_notes ? `<div class="note"><b>既有舊損備註：</b>${a.pre_existing_notes}（兩照皆存在，不列入本次求償）</div>` : "";
  const priceBox = pricingCard({ pricing: j.pricing });
  const casc = j.cascade
    ? `<div class="note"><b>級聯複核：</b>快篩臨界（${j.cascade.reason}）→ ${j.cascade.model} ${j.cascade.votes ? j.cascade.votes.length + " 票 [" + j.cascade.votes.map(v => v ? "有損" : "無損").join("、") + "]" : "複核"} → ${j.cascade.flipped ? "翻轉" : "維持"}快篩結論</div>`
    : `<div class="note"><b>級聯：</b>快篩信心充足，未升級複核（對應實測 97.2% 案件停在快篩層）</div>`;
  return `<div class="d-card verdict">${head}<div class="v-sub">${sub}</div>${rows}${pre}${priceBox}${casc}</div>`;
}

function liveResultHtml(j) {
  const steps = `<div class="d-card"><div class="steplog">${(j.logs || []).map(l => `<div class="on">${l}</div>`).join("")}
    <div>完成 ・ 耗時 ${j.elapsed_s} 秒 ・ 判讀模型 ${(j.screening || {}).model || "—"}</div></div></div>`;
  const gate = `<div class="d-card"><div class="v-sub" style="margin-bottom:8px"><b>① Quality Gate（純 CV，零 API 成本）</b></div>${liveGateHtml(j)}</div>`;
  if (j.verdict === "retake") {
    if (j.retake_reason === "photo_invalid") {
      // 固定文案：photo_ok 是模型判斷非 ground truth，不宣稱「一定不是車內照」；
      // invalid_reason 為模型自由文字，僅保留於 API result，不渲染進 HTML
      return steps + gate + `
      <div class="d-card verdict"><h3 class="warn"><span class="ico">◐</span>無法判讀 — 請重新拍攝</h3>
        <div class="v-sub">無法確認這是一張適合判讀車內整潔度的照片，請重新拍攝車內範圍。</div></div>`;
    }
    return steps + gate + `
      <div class="d-card verdict"><h3 class="warn"><span class="ico">◐</span>品質不合格 — 請重拍</h3>
        <div class="v-sub">實際系統中此照片會在 App 拍攝當下被即時擋下並顯示重拍原因（環節一）。</div>
        <div class="actions" style="margin-top:10px"><button class="btn" onclick="runLiveJudge(true)">仍要強制判定（跳過品質檢核）</button></div></div>`;
  }
  const ann = j.annotated_b64 ? "data:image/jpeg;base64," + j.annotated_b64 : null;
  const nAnn = ((j.final || {}).damages || (j.final || {}).findings || []).length;
  const photos = j.mode === "pair"
    ? `<div class="photos">
        <div class="photo d-card"><div class="cap"><span class="before">借車照</span><span class="t">比對基準</span></div>
          <div class="imgwrap"><img src="${LIVE.urls.pickup}" alt="借車照"></div></div>
        <div class="photo d-card"><div class="cap"><span class="after">還車照</span><span class="t">${nAnn ? "AI 標註 " + nAnn + " 處" : "本次判定"}</span></div>
          <div class="imgwrap"><img src="${ann || LIVE.urls.ret}" alt="還車照（AI 標註）"></div></div></div>`
    : `<div class="photos" style="grid-template-columns:1fr;max-width:560px">
        <div class="photo d-card"><div class="cap"><span class="after">車內照</span><span class="t">${nAnn ? "AI 標註 " + nAnn + " 處" : "單照判讀"}</span></div>
          <div class="imgwrap"><img src="${ann || LIVE.urls.interior}" alt="車內照（AI 標註）"></div></div></div>`;
  const lv = LEVEL_META[j.level] ? `<span class="badge ${j.level.toLowerCase()}">${LEVEL_META[j.level].ico} ${LEVEL_META[j.level].label}</span>` : "";
  const saveBtn = j.final && j.judge_id
    ? `<span class="spacer"></span><button class="btn danger" onclick="saveLiveCase(this)">⊕ 存入案件佇列</button>` : "";
  return steps + gate + `<div class="d-card d-head"><span class="plate">現場實測</span>${lv}<span class="badge soft">${j.kind}</span>${saveBtn}</div>` + photos + liveVerdictHtml(j);
}

function renderLive() {
  const el = document.getElementById("detail");
  if (!SERVER) {
    el.innerHTML = `<div class="d-card verdict"><h3 class="warn"><span class="ico">◐</span>現場實測需要 server 版</h3>
      <div class="v-sub">單檔版無法呼叫 AI。請在有 環節二/.env（GEMINI_API_KEY）的機器上啟動：</div>
      <div class="steplog" style="margin-top:8px">cd 環節二_還車影像AI辨識/dashboard<br>uvicorn server:app --host 0.0.0.0 --port 8000</div>
      <div class="v-sub" style="margin-top:8px">然後開 http://localhost:8000 → 現場實測。CLI 版：python3 pipeline/judge_photos.py 借車照 還車照</div></div>`;
    return;
  }
  const slots = LIVE.mode === "pair"
    ? [["pickup", "借車照", "比對基準"], ["ret", "還車照", "找新增損傷"]]
    : [["interior", "車內照", "整潔分級"]];
  const ready = slots.every(([k]) => LIVE.files[k]);
  const drops = slots.map(([k, lbl, hint]) => `
    <div class="drop ${""}" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')"
         ondrop="liveDrop(event,'${k}')" onclick="document.getElementById('lf_${k}').click()">
      <span class="slotcap">${lbl}</span>
      ${LIVE.urls[k] ? `<img src="${LIVE.urls[k]}" alt="${lbl}">` : `<div class="hint"><b>＋ ${lbl}</b>點擊選取或拖入照片<br><span style="font-size: 13.8px">${hint}</span></div>`}
      <input type="file" id="lf_${k}" accept="image/*" hidden onchange="liveFile(this,'${k}')">
    </div>`).join("");

  el.innerHTML = `
    <div class="d-card d-head">
      <span class="plate">現場實測</span><span class="badge soft">任意照片・即時判定・不綁資料集</span>
      <span class="spacer"></span>
      <div class="live-ctl">
        <button class="chip" aria-pressed="${LIVE.mode === "pair"}" onclick="setLiveMode('pair')">車損比對（借/還兩張）</button>
        <button class="chip" aria-pressed="${LIVE.mode === "interior"}" onclick="setLiveMode('interior')">車內整潔（單張）</button>
      </div>
    </div>
    <div class="d-card" style="padding:14px">
      <div class="live-drops ${LIVE.mode === "interior" ? "single" : ""}">${drops}</div>
      <div class="live-ctl" style="margin-top:12px">
        <button class="btn danger" ${ready && !LIVE.busy ? "" : "disabled"} onclick="runLiveJudge(false)">▶ 開始判定</button>
        <button class="btn" ${LIVE.busy ? "disabled" : ""} onclick="liveReset()">清除重來</button>
        <span style="color:var(--faint);font-size: 13.8px">鏈路：Quality Gate → Flash 快篩 → 臨界升級 Pro 多數決 → 視覺標註 ・ 照片僅暫存於記憶體，判定後即刪除</span>
      </div>
    </div>
    ${LIVE.gate && !LIVE.result ? `<div class="d-card"><div class="v-sub" style="margin-bottom:8px"><b>① Quality Gate（純 CV，零 API 成本）${LIVE.gate.gate_pass ? " — 通過" : " — 未通過"}</b></div>${liveGateHtml({ gate: LIVE.gate.gate })}</div>` : ""}
    ${LIVE.gate && !LIVE.gate.gate_pass && !LIVE.busy && !LIVE.result ? `
      <div class="d-card verdict"><h3 class="warn"><span class="ico">◐</span>品質不合格 — 請重拍</h3>
        <div class="v-sub">實際系統中此照片會在 App 拍攝當下被即時擋下並顯示重拍原因（環節一）。換照片重試，或跳過檢核強制判定。</div>
        <div class="actions" style="margin-top:10px"><button class="btn" onclick="runLiveJudge(true)">仍要強制判定（跳過品質檢核）</button></div></div>` : ""}
    ${LIVE.busy === "gate" ? `<div class="d-card verdict"><h3><span class="spin"></span>&nbsp;① 品質檢核中…</h3>
      <div class="v-sub">純 CV 檢核（清晰度／曝光），不到 1 秒。</div></div>` : ""}
    ${LIVE.busy === "judge" ? `<div class="d-card verdict"><h3><span class="spin"></span>&nbsp;② AI 判定中…</h3>
      <div class="v-sub">Flash 快篩（約 10 秒）→ 臨界案件升級 Pro 多數決（最多再 40 秒）→ 視覺標註</div>
      <div class="steplog">已耗時 <span id="live-elapsed" class="mono">0 秒</span></div></div>` : ""}
    ${LIVE.error ? `<div class="d-card verdict"><h3 class="crit"><span class="ico">✕</span>判定失敗</h3><div class="v-sub">${LIVE.error}</div></div>` : ""}
    ${LIVE.result ? liveResultHtml(LIVE.result) : ""}
    ${qrCardHtml()}`;
  loadQr();
}

/* --- 手機掃碼直開（評審現場用手機拍、直接上傳） --- */
function qrCardHtml() {
  if (!LIVE.qr) return "";
  return `<div class="d-card" style="display:flex;align-items:center;gap:16px;padding:12px 16px">
    <img src="data:image/png;base64,${LIVE.qr.png_b64}" alt="監理台 QR" style="width:110px;height:110px;border-radius:4px;background:#fff;padding:4px">
    <div><div style="font-weight:700;margin-bottom:4px">手機掃碼直開</div>
      <div style="font-size: 14.6px;color:var(--muted);line-height:1.8">同一 Wi-Fi 下用手機掃碼 → 開「現場實測」→ 直接用相機拍借/還照上傳，現場拍現場判。<br>
      <span class="mono" style="color:var(--acc-ink)">${LIVE.qr.url}</span></div></div></div>`;
}
async function loadQr() {
  if (!SERVER || LIVE.qr || LIVE.qrLoading) return;
  LIVE.qrLoading = true;
  try {
    const r = await fetch("/api/qr");
    if (r.ok) { LIVE.qr = await r.json(); if (viewMode === "live") renderLive(); }
  } catch (e) {}
}

/* ================= 事件 ================= */
function renderAll() {
  document.getElementById("main").classList.toggle("full", viewMode === "ops" || viewMode === "live" || viewMode === "method");
  renderTabs(); renderStats(); renderFilters(); renderList(); renderDetail();
}
function setMode(m) {
  viewMode = m;
  if (m === "passport" && !currentCar) currentCar = null;
  renderAll();
}
function setFilter(f) { viewMode = "cases"; filter = f; renderAll(); }
function selectCase(id) { currentId = id; renderList(); renderDetail(); }
function decide(id, kind) {
  const prev = decisions[id];
  decisions[id] = kind; save(); advance(id); renderAll();
  if (SERVER) fetch("/api/decision", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ case_id: id, decision: kind }) })
    // rollback 邊界只涵蓋持久化本身：HTTP 非 2xx 或網路中斷。後續 refresh 失敗不得回滾已保存的裁決
    .then(r => r.ok ? null : "HTTP " + r.status, e => String(e))
    .then(fail => {
      if (fail) {
        if (prev === undefined) delete decisions[id]; else decisions[id] = prev;
        renderAll();
        alert("裁決未成功保存（" + fail + "），畫面已還原，請重試");
        return;
      }
      refreshLabels().then(() => renderStats()).catch(() => {});
    });
}
function undoDecision(id) {
  const prev = decisions[id];
  delete decisions[id]; save(); renderAll();
  if (SERVER) fetch("/api/decision/" + encodeURIComponent(id), { method: "DELETE" })
    .then(r => r.ok ? null : "HTTP " + r.status, e => String(e))
    .then(fail => {
      if (fail) {
        if (prev !== undefined) decisions[id] = prev;
        renderAll();
        alert("復原未成功保存（" + fail + "），畫面已還原，請重試");
        return;
      }
      refreshLabels().then(() => renderStats()).catch(() => {});
    });
}


// ---------- 估價與處置（S6，純規則零 API）＋ 多對象文案（S7，按需呼叫） ----------
// 判定回答「有沒有損傷」，這兩層回答「所以要花多少錢、誰該收到什麼通知」——
// 客服複核時真正需要的是後者。估價由 server 端 disposition.py 產生，前端只負責顯示。
const BAND_LABEL = { A: "低", B: "中", C: "高", D: "極高" };
const DISPO_LABEL = {
  auto_action: ["自動處置", "p1"],
  human_review: ["人工複核", "p2"],
  record_only: ["僅記錄", "p3"],
  waive_not_worth_claiming: ["不值得索賠", "p3"],
  pre_existing: ["既有損", "p3"],
};

function money(v) { return "NT$" + Number(v).toLocaleString(); }

function pricingCard(cs) {
  const p = cs && cs.pricing;
  if (!p || p.error || !p.items || !p.items.length) return "";
  const rows = p.items.map(it => {
    const [lbl, cls] = DISPO_LABEL[it.disposition] || ["—", "p3"];
    return `<tr>
      <td>${it.location || "—"}</td>
      <td><span class="band b${it.band}">${it.band}</span> ${it.band_label || BAND_LABEL[it.band] || ""}</td>
      <td>${it.repair_action || "—"}</td>
      <td class="num">${money(it.estimate_twd[0])} – ${money(it.estimate_twd[1])}</td>
      <td><span class="badge ${cls}">${lbl}</span></td>
    </tr>`;
  }).join("");
  const waived = p.waived_count
    ? `<div class="note">其中 ${p.waived_count} 項估價低於索賠處理成本，系統建議記為自然耗損不啟動索賠——<b>能算出「不值得追」也是系統價值</b>。</div>`
    : "";
  return `<div class="d-card pricing">
    <h4>維修估價與處置建議 <span class="muted">（規則表產生，零 API；示意價需依維修合約替換）</span></h4>
    <table class="ptab"><thead><tr><th>部位</th><th>級距</th><th>維修動作</th><th>估價區間</th><th>處置</th></tr></thead>
    <tbody>${rows}</tbody></table>
    <div class="ptotal">可索賠合計：<b>${money(p.total_estimate_twd[0])} – ${money(p.total_estimate_twd[1])}</b>
      <span class="muted">${p.note || ""}</span></div>
    ${waived}
    ${SERVER ? `<button class="btn" onclick="genNotify('${cs.id || ""}', '${cs.judge_id || ""}', this)">✉ 產生三對象通知文案</button>
      <div class="notifyout"></div>` : ""}
  </div>`;
}

async function genNotify(caseId, judgeId, btn) {
  btn.disabled = true; const old = btn.textContent;
  btn.textContent = "文案生成中…（約 5 秒）";
  const out = btn.parentElement.querySelector(".notifyout");
  try {
    const body = judgeId ? { judge_id: judgeId } : { case_id: caseId };
    const r = await fetch("/api/notify", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || "生成失敗");
    const u = j.user_notification, c = j.cs_brief, w = j.work_order;
    const g = j.grounding_check || {};
    out.innerHTML = `
      <div class="nblock"><h5>① 用戶通知 <span class="muted">中性、不歸咎、無術語</span></h5>
        <div class="ntitle">${u.title}</div><p>${u.body}</p>
        <div class="muted">${u.evidence_note}｜${u.dispute_channel_note}</div></div>
      <div class="nblock"><h5>② 客服工作說明 <span class="badge ${c.dispute_risk === "high" ? "p1" : c.dispute_risk === "medium" ? "p2" : "p3"}">爭議風險 ${c.dispute_risk}</span></h5>
        <p>${c.summary}</p>
        <div class="muted">${c.confidence_note}</div>
        <div class="muted">${c.coverage_caveat}</div>
        <div class="muted"><b>建議處置：</b>${c.recommended_action}｜${c.dispute_risk_reason}</div></div>
      <div class="nblock"><h5>③ ${w.type === "cleaning" ? "清潔" : w.type === "repair" ? "維修" : "清潔＋維修"}派工單
        <span class="muted">預估 ${w.estimated_minutes} 分鐘・${w.priority === "urgent" ? "急件" : "一般"}</span></h5>
        <ul>${(w.items || []).map(i => `<li>${i}</li>`).join("")}</ul>
        ${(w.special_tools || []).length ? `<div class="muted">需備工具：${w.special_tools.join("、")}</div>` : ""}</div>
      <div class="gcheck ${g.passed ? "ok" : "bad"}">${g.passed
        ? "✓ 程式面查核通過：無杜撰金額、無歸咎性表述、用戶通知未含內部代碼"
        : "✗ 查核未過：" + (g.problems || []).join("；")}</div>`;
    btn.textContent = "✓ 已生成（可再按重新產生）"; btn.disabled = false;
  } catch (e) {
    out.innerHTML = `<div class="gcheck bad">生成失敗：${e.message || e}</div>`;
    btn.textContent = old; btn.disabled = false;
  }
}

async function rejudge(id, btn) {
  btn.disabled = true; btn.textContent = "AI 重判中…（快篩約 10 秒，臨界案件升級複核較久）";
  try {
    const r = await fetch("/api/rejudge", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ case_id: id }) });
    const j = await r.json();
    if (r.ok && j.assessment) {
      const cs = CASES.find(c => c.id === id);
      cs.assessment = j.assessment;
      // 重判走完整鏈路，分級與標註框一併更新，否則畫面會停在舊的 P 級與舊的框
      if (j.level) { cs.level = j.level; cs.kind = j.kind; }
      if (j.annotation) {
        // 全站標註疊加層讀的是 ANN（ANNOTATIONS 的別名），改這裡才會生效
        if (j.annotation.findings.length) ANN[id] = j.annotation;
        else delete ANN[id];
      }
      renderAll();
    } else {
      btn.disabled = false; btn.textContent = "⟲ AI 重判";
      alert(j.detail || j.error || "重判失敗");
    }
  } catch (e) { btn.disabled = false; btn.textContent = "⟲ AI 重判"; alert("重判失敗：" + e); }
}
function advance(id) {
  const vis = visible();
  const i = vis.findIndex(c => c.id === id);
  const next = vis.slice(i + 1).find(c => !decisions[c.id]) || vis.find(c => !decisions[c.id]);
  if (next) currentId = next.id;
}
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (viewMode === "ops" || viewMode === "live" || viewMode === "method") return;
  if (viewMode === "passport") {
    const cars = Object.keys(PASSPORTS).sort((a, b) => PASSPORTS[b].open_new - PASSPORTS[a].open_new || a.localeCompare(b));
    const ci = cars.indexOf(currentCar);
    if (e.key === "ArrowDown" && ci < cars.length - 1) { currentCar = cars[ci + 1]; renderList(); renderDetail(); e.preventDefault(); }
    else if (e.key === "ArrowUp" && ci > 0) { currentCar = cars[ci - 1]; renderList(); renderDetail(); e.preventDefault(); }
    return;
  }
  const vis = visible();
  const i = vis.findIndex(c => c.id === currentId);
  if (e.key === "ArrowDown" && i < vis.length - 1) { currentId = vis[i + 1].id; renderList(); renderDetail(); e.preventDefault(); }
  else if (e.key === "ArrowUp" && i > 0) { currentId = vis[i - 1].id; renderList(); renderDetail(); e.preventDefault(); }
  else if (e.key === "1" && currentId && !decisions[currentId]) decide(currentId, "confirm");
  else if (e.key === "2" && currentId && !decisions[currentId]) decide(currentId, "reject");
  else if (e.key === "3" && currentId && !decisions[currentId]) decide(currentId, "retake");
});

(async function initApp() {
  await loadDecisions();
  await loadLiveCases();
  await refreshLabels();
  renderAll();
  if (SERVER) {
    // 每 5 秒同步一次全隊複核狀態與現場案件；有變化才重繪
    setInterval(async () => {
      let changed = await syncLiveCases();
      try {
        const d = await (await fetch("/api/decisions")).json();
        if (JSON.stringify(d) !== JSON.stringify(decisions)) { decisions = d; changed = true; }
      } catch (e) {}
      const before = LABELS && LABELS.total_events;
      await refreshLabels();
      if (LABELS && LABELS.total_events !== before) changed = true;
      if (changed) renderAll();
    }, 5000);
  }
})();
</script>
