<title>iRent 車況監理台</title>
<style>
  /* 車隊監理台 — 深色營運 console，單一主題（刻意選擇；所有顏色皆明確上色） */
  :root {
    --bg: #0B100E;
    --panel: #111814;
    --panel2: #17211C;
    --panel3: #1D2A23;
    --line: #22312A;
    --line2: #2F443A;
    --ink: #E9F2EC;
    --muted: #8AA094;
    --faint: #5D7268;
    --acc: #3ADD8A;
    --acc-ink: #7FEBB4;
    --acc-soft: rgba(58, 221, 138, .10);
    --red: #FF6C5E;
    --red-soft: rgba(255, 108, 94, .12);
    --amber: #F0B054;
    --amber-soft: rgba(240, 176, 84, .12);
    --ok: #3ADD8A;
    --ok-soft: rgba(58, 221, 138, .10);
  }

  * { box-sizing: border-box; }
  html { scrollbar-gutter: stable; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", -apple-system, "Segoe UI", sans-serif;
    font-size: 14px; line-height: 1.6;
  }
  .mono, kbd, .plate { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
  .micro { font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
  button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  button:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
  ::selection { background: rgba(58, 221, 138, .25); }

  /* ================= 頂列 ================= */
  .topbar {
    display: flex; align-items: center; gap: 22px; flex-wrap: wrap;
    padding: 10px 22px; background: var(--panel); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 30;
  }
  .brand { display: flex; align-items: center; gap: 11px; white-space: nowrap; }
  .brand .mark {
    width: 30px; height: 30px; border-radius: 4px; flex: none;
    background: var(--acc);
    display: grid; place-items: center;
  }
  .brand .mark svg { display: block; }
  .brand .t1 { font-weight: 800; font-size: 15.5px; letter-spacing: .01em; line-height: 1.25; }
  .brand .t1 .g { color: var(--acc); }
  .brand .t2 { font-size: 9.5px; font-weight: 700; letter-spacing: .22em; color: var(--faint); text-transform: uppercase; line-height: 1; }

  .tabs { display: flex; gap: 0; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .tab {
    padding: 7px 18px; font-weight: 700; font-size: 13.5px; color: var(--muted);
    display: flex; align-items: center; gap: 8px; border-right: 1px solid var(--line);
    background: var(--panel);
  }
  .tab:last-child { border-right: none; }
  .tab:hover { color: var(--ink); background: var(--panel2); }
  .tab[aria-selected="true"] { background: var(--panel3); color: var(--acc-ink); box-shadow: inset 0 -2px 0 var(--acc); }
  .tab .cnt { font-family: ui-monospace, Menlo, monospace; font-size: 11px; font-weight: 700; color: var(--faint); }
  .tab[aria-selected="true"] .cnt { color: var(--acc); }

  .top-right { margin-left: auto; display: flex; align-items: center; gap: 16px; white-space: nowrap; }
  .live { display: flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 700; color: var(--muted); }
  .live .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 0 0 rgba(58,221,138,.5); animation: pulse 2.2s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(58,221,138,.45); } 70% { box-shadow: 0 0 0 7px rgba(58,221,138,0); } 100% { box-shadow: 0 0 0 0 rgba(58,221,138,0); } }
  .clock { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .batch { font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; letter-spacing: .08em; color: var(--faint); border: 1px solid var(--line); border-radius: 3px; padding: 3px 9px; }

  /* ================= 進度列（案件模式） ================= */
  .statsbar {
    display: flex; align-items: center; gap: 22px; flex-wrap: wrap;
    padding: 8px 22px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .statsbar:empty { display: none; }
  .progress { display: flex; align-items: center; gap: 10px; min-width: 240px; flex: 1; max-width: 420px; }
  .progress .lbl { font-size: 12px; font-weight: 700; white-space: nowrap; color: var(--muted); }
  .progress .track { flex: 1; height: 5px; border-radius: 2px; background: var(--panel3); overflow: hidden; }
  .progress .fill { height: 100%; background: var(--acc); transition: width .3s; }
  .progress .pct { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .statpills { display: flex; gap: 14px; flex-wrap: wrap; }
  .spill { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .spill .dot { width: 7px; height: 7px; border-radius: 50%; }
  .spill.crit { color: var(--red); } .spill.crit .dot { background: var(--red); }
  .spill.warn { color: var(--amber); } .spill.warn .dot { background: var(--amber); }
  .spill.okp { color: var(--ok); } .spill.okp .dot { background: var(--ok); }

  /* ================= 主版面 ================= */
  .main { display: grid; grid-template-columns: 372px 1fr; gap: 16px; padding: 16px 22px 40px; align-items: start; }
  .main.full { grid-template-columns: 1fr; }
  .main.full .left { display: none; }
  @media (max-width: 940px) { .main { grid-template-columns: 1fr; } }

  /* ---------- 左欄 ---------- */
  .left { display: flex; flex-direction: column; gap: 10px; }
  .filters { display: flex; gap: 5px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line); background: var(--panel); color: var(--muted);
    border-radius: 3px; padding: 3px 11px; font-size: 12px; font-weight: 700;
  }
  .chip:hover { border-color: var(--line2); color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--acc); color: #06231A; border-color: var(--acc); }
  .chip .n { opacity: .65; margin-left: 5px; font-variant-numeric: tabular-nums; font-family: ui-monospace, Menlo, monospace; font-size: 11px; }

  .list { display: flex; flex-direction: column; gap: 6px; max-height: calc(100vh - 210px); overflow-y: auto; padding: 2px 2px 2px 0; }
  .item {
    display: grid; grid-template-columns: 52px 1fr auto; gap: 0 11px; align-items: center;
    text-align: left; width: 100%; flex: none;
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
    padding: 9px 11px 9px 14px; position: relative; overflow: hidden;
  }
  .item .stripe { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
  .item.lv-p1 .stripe { background: var(--red); }
  .item.lv-p2 .stripe { background: var(--amber); }
  .item.lv-p3 .stripe { background: var(--line2); }
  .item:hover { background: var(--panel2); border-color: var(--line2); }
  .item[aria-current="true"] { border-color: var(--acc); background: var(--panel2); }
  .item .thumb { width: 52px; height: 52px; border-radius: 3px; object-fit: cover; background: var(--panel3); display: block; }
  .item .mid { min-width: 0; }
  .item .t1 { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .item .plate { font-weight: 800; font-size: 14px; letter-spacing: .02em; }
  .item .angle { font-size: 11.5px; color: var(--muted); font-weight: 600; }
  .item .desc { display: block; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .right { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
  .item .state { font-size: 13px; line-height: 1; color: var(--acc); }

  .badge {
    display: inline-flex; align-items: center; gap: 4px; border-radius: 3px; padding: 1.5px 7px;
    font-size: 10.5px; font-weight: 800; letter-spacing: .06em; white-space: nowrap;
    font-family: ui-monospace, Menlo, monospace;
  }
  .badge.p1 { background: var(--red-soft); color: var(--red); border: 1px solid var(--red); }
  .badge.p2 { background: var(--amber-soft); color: var(--amber); border: 1px solid var(--amber); }
  .badge.p3 { background: var(--ok-soft); color: var(--ok); border: 1px solid rgba(58,221,138,.4); }
  .badge.soft { background: var(--panel3); color: var(--muted); border: 1px solid var(--line2); font-weight: 700; }
  .badge.f2tag { background: var(--acc-soft); color: var(--acc-ink); border: 1px solid rgba(58,221,138,.35); font-weight: 700; }

  /* ---------- 右欄（詳情） ---------- */
  .detail { display: flex; flex-direction: column; gap: 13px; min-width: 0; }
  .d-card { background: var(--panel); border: 1px solid var(--line); border-radius: 5px; }

  .d-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 13px 16px; }
  .d-head .plate { font-size: 23px; font-weight: 800; letter-spacing: .02em; }
  .d-head .angle { font-size: 14px; font-weight: 700; color: var(--muted); }
  .d-head .spacer { flex: 1; }

  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    border-radius: 4px; padding: 7px 15px; font-weight: 800; font-size: 13px;
    border: 1px solid var(--line2); background: var(--panel2); color: var(--ink);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { background: var(--panel3); border-color: var(--faint); }
  .btn.danger { background: var(--red); border-color: var(--red); color: #2A0B08; }
  .btn.danger:hover { filter: brightness(1.1); }

  .decided {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    border-radius: 4px; padding: 7px 13px; font-weight: 800; font-size: 13px; border: 1px solid;
  }
  .decided.confirm { background: var(--red-soft); color: var(--red); border-color: var(--red); }
  .decided.reject { background: var(--ok-soft); color: var(--ok); border-color: rgba(58,221,138,.5); }
  .decided.retake { background: var(--amber-soft); color: var(--amber); border-color: var(--amber); }
  .decided .undo { text-decoration: underline; font-weight: 700; font-size: 12px; color: inherit; opacity: .85; }

  .photos { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
  @media (max-width: 640px) { .photos { grid-template-columns: 1fr; } }
  .photo { overflow: hidden; border-radius: 5px; }
  .photo .cap {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 13px; font-size: 12.5px; font-weight: 800; border-bottom: 1px solid var(--line);
  }
  .photo .cap .t { color: var(--faint); font-weight: 600; font-size: 11px; }
  .photo .cap .before { color: var(--muted); }
  .photo .cap .after { color: var(--acc-ink); }
  .photo img { display: block; width: 100%; height: auto; }
  .imgwrap { position: relative; }
  .imgwrap.zoomable { cursor: crosshair; }
  .lens {
    position: absolute; width: 148px; height: 148px; border-radius: 50%;
    border: 2px solid var(--acc); box-shadow: 0 0 0 2px rgba(0,0,0,.5), 0 6px 18px rgba(0,0,0,.5);
    background-repeat: no-repeat; pointer-events: none; display: none; z-index: 5;
  }
  .zoom-hint { font-size: 11px; color: var(--faint); padding: 4px 13px 7px; }

  .annbox {
    position: absolute; border: 2.5px solid var(--red); border-radius: 3px;
    box-shadow: 0 0 0 1px rgba(0,0,0,.4); pointer-events: none;
    transition: box-shadow .15s, border-width .15s;
  }
  .annbox .n {
    position: absolute; top: -11px; left: -11px; width: 21px; height: 21px;
    background: var(--red); color: #2A0B08; border-radius: 50%;
    font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center;
    font-family: ui-monospace, Menlo, monospace;
  }
  .annbox.hot { border-width: 3.5px; box-shadow: 0 0 0 3px rgba(255,108,94,.4), 0 0 16px rgba(255,108,94,.55); }

  .verdict { padding: 15px 16px; }
  .verdict h3 { margin: 0 0 4px; font-size: 16px; display: flex; align-items: center; gap: 9px; }
  .verdict h3 .ico { font-size: 18px; }
  .verdict h3.crit { color: var(--red); }
  .verdict h3.warn { color: var(--amber); }
  .verdict h3.ok { color: var(--ok); }
  .v-sub { color: var(--muted); font-size: 12.5px; margin-bottom: 8px; }

  .dmg { border-top: 1px solid var(--line); padding: 10px 8px; margin: 0 -8px; }
  .dmg.linked { cursor: pointer; }
  .dmg.linked:hover { background: var(--panel2); }
  .dmg .l1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 800; font-size: 13.5px; }
  .dmg .num {
    display: inline-flex; width: 20px; height: 20px; border-radius: 50%;
    background: var(--red); color: #2A0B08; font-size: 11.5px; font-weight: 800;
    align-items: center; justify-content: center;
    font-family: ui-monospace, Menlo, monospace; flex: none;
  }
  .sev { font-size: 10px; font-weight: 800; border-radius: 3px; padding: 1px 6px; letter-spacing: .07em; font-family: ui-monospace, Menlo, monospace; }
  .sev.high { background: var(--red); color: #2A0B08; }
  .sev.medium { background: var(--amber); color: #2A1B05; }
  .sev.low { background: var(--panel3); color: var(--muted); }
  .conf { display: flex; align-items: center; gap: 8px; margin: 6px 0 4px; font-size: 11.5px; color: var(--muted); }
  .conf .track { flex: 0 1 170px; height: 4px; border-radius: 2px; background: var(--panel3); overflow: hidden; }
  .conf .fill { height: 100%; background: var(--acc); }
  .dmg .why { font-size: 12.5px; color: var(--muted); border-left: 2px solid var(--line2); padding-left: 10px; margin-top: 4px; }
  .note { margin-top: 10px; font-size: 12px; color: var(--muted); }
  .note b { color: var(--ink); }

  .kbd-hint { font-size: 11.5px; color: var(--faint); padding: 0 4px; }
  kbd { border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 3px; padding: 0 5px; font-size: 10.5px; background: var(--panel2); }

  /* ---------- 營運總覽 ---------- */
  .ops { display: flex; flex-direction: column; gap: 14px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 14px 16px 12px; }
  .kpi .num {
    font-family: ui-monospace, Menlo, monospace; font-size: 30px; font-weight: 800; line-height: 1.15;
    font-variant-numeric: tabular-nums; letter-spacing: -.01em;
  }
  .kpi .num .unit { font-size: 15px; color: var(--muted); font-weight: 700; margin-left: 2px; }
  .kpi .sub { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  .kpi.good .num { color: var(--acc); }
  .kpi.crit .num { color: var(--red); }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 15px 18px 16px; min-width: 0; }
  .panel .p-title { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .panel .p-title b { font-size: 14.5px; font-weight: 800; }
  .panel .p-title .micro { transform: translateY(-1px); }

  .ops-grid { display: grid; grid-template-columns: 3fr 2fr; gap: 14px; align-items: start; }
  @media (max-width: 980px) { .ops-grid { grid-template-columns: 1fr; } }

  .flow-wrap { overflow-x: auto; }
  .flow-svg { display: block; min-width: 660px; width: 100%; }
  .flow-svg text { font-family: "Noto Sans TC", "PingFang TC", sans-serif; }
  .flow-svg .nd { fill: var(--panel2); stroke: var(--line2); }
  .flow-svg .nd.hi { stroke: var(--acc); }
  .flow-svg .tt { fill: var(--ink); font-size: 12.5px; font-weight: 700; }
  .flow-svg .ts { fill: var(--muted); font-size: 10.5px; }
  .flow-svg .tn { fill: var(--acc-ink); font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; font-weight: 700; }
  .flow-svg .pipe { fill: none; stroke-linecap: round; }
  .flow-svg .pipe.base { stroke: var(--panel3); }
  .flow-svg .pipe.anim { stroke-dasharray: 1 14; animation: flowdash 1.1s linear infinite; }
  @keyframes flowdash { to { stroke-dashoffset: -15; } }
  @media (prefers-reduced-motion: reduce) {
    .flow-svg .pipe.anim { animation: none; stroke-dasharray: none; opacity: .55; }
    .live .pulse { animation: none; }
  }

  .hotcar { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
  @media (max-width: 560px) { .hotcar { grid-template-columns: 1fr; } }
  .hot-svg { display: block; width: 190px; margin: 0 auto; }
  .hot-svg .sil { fill: var(--panel2); stroke: var(--line2); stroke-width: 1.5; }
  .hot-svg .zn { stroke: rgba(255,108,94,.25); stroke-width: 1; rx: 4; }
  .hot-svg .zl { fill: var(--ink); font-family: ui-monospace, Menlo, monospace; font-size: 13px; font-weight: 800; text-anchor: middle; }
  .hbar { display: flex; align-items: center; gap: 9px; font-size: 12.5px; padding: 3px 0; }
  .hbar .hn { width: 86px; flex: none; color: var(--muted); font-weight: 700; text-align: right; }
  .hbar .track { flex: 1; height: 9px; background: var(--panel3); border-radius: 2px; overflow: hidden; }
  .hbar .fill { height: 100%; background: var(--red); border-radius: 2px; }
  .hbar .hv { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--ink); width: 60px; }

  .dq { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .dq .cell { border: 1px solid var(--line); border-radius: 4px; padding: 11px 13px; background: var(--panel2); }
  .dq .big { font-family: ui-monospace, Menlo, monospace; font-size: 23px; font-weight: 800; }
  .dq .big.warn { color: var(--amber); }
  .dq .big.crit { color: var(--red); }
  .dq .big.good { color: var(--acc); }
  .dq .cap2 { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .splitbar { display: flex; height: 9px; border-radius: 2px; overflow: hidden; margin: 8px 0 4px; }
  .splitbar span { display: block; height: 100%; }

  /* ---------- 車輛護照 ---------- */
  .p-layout { display: grid; grid-template-columns: 360px 1fr; gap: 0; }
  @media (max-width: 760px) { .p-layout { grid-template-columns: 1fr; } }
  .p-map { padding: 12px 12px 8px; border-right: 1px solid var(--line); }
  @media (max-width: 760px) { .p-map { border-right: none; border-bottom: 1px solid var(--line); } }
  .viz-toggle { display: flex; gap: 0; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; width: fit-content; margin: 0 auto 8px; }
  .viz-toggle button { padding: 3px 14px; font-size: 12px; font-weight: 800; color: var(--muted); background: var(--panel); }
  .viz-toggle button + button { border-left: 1px solid var(--line); }
  .viz-toggle button[aria-pressed="true"] { background: var(--panel3); color: var(--acc-ink); }
  #carviz { position: relative; }
  #carviz canvas { display: block; margin: 0 auto; border-radius: 5px; cursor: grab; touch-action: none; }
  #carviz canvas:active { cursor: grabbing; }
  .viz-hint { text-align: center; font-size: 11px; color: var(--faint); margin-top: 2px; }
  .p-recs { padding: 13px 16px; }
  .car-svg { display: block; max-width: 300px; margin: 0 auto; }
  .car-svg .zone { fill: var(--panel2); stroke: var(--line); }
  .car-svg .zlbl { fill: var(--muted); font-size: 13px; }
  .car-body { fill: var(--panel3); stroke: var(--muted); stroke-width: 2; stroke-linejoin: round; }
  .car-glass { fill: var(--line); stroke: var(--muted); stroke-width: 1; }
  .car-wheel { fill: var(--muted); }
  .car-line { stroke: var(--line2); stroke-width: 1.5; fill: none; }
  .car-lamp { fill: var(--amber-soft); stroke: var(--muted); stroke-width: 1; }
  .car-tail { fill: var(--red-soft); stroke: var(--muted); stroke-width: 1; }
  .dot { cursor: pointer; }
  .dot circle { stroke: var(--bg); stroke-width: 1.5; }
  .dot.new circle { fill: var(--red); }
  .dot.pre circle { fill: var(--faint); }
  .dot text { fill: var(--bg); font-size: 10px; font-weight: 800; }
  .dot.hot circle { r: 13; filter: drop-shadow(0 0 6px rgba(255,108,94,.8)); }
  .rec { border-top: 1px solid var(--line); padding: 10px 8px; margin: 0 -8px; }
  .rec:hover, .rec.hot { background: var(--panel2); }
  .rec .l1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 800; font-size: 13px; }
  .rec .meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .rec .meta b { color: var(--ink); font-weight: 700; }
  .evlink { color: var(--acc-ink); font-weight: 800; font-size: 12px; cursor: pointer; }
  .evlink:hover { text-decoration: underline; }
  .orders { margin-top: 12px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
  .orders .mono { color: var(--ink); }

  .parts-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .parts-table th { padding: 5px 8px; text-align: left; color: var(--faint); font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
  .parts-table td { padding: 6px 8px; border-top: 1px solid var(--line); }

  .foot { padding: 10px 22px 30px; color: var(--faint); font-size: 11.5px; max-width: 1100px; }
</style>

<div class="topbar">
  <span class="brand">

<script>
/* ================= 資料整備 ================= */
F2CASES.forEach(c => CASES.push(c));
{ const ord = { P1: 0, P2: 1, P3: 2 }; CASES.sort((a, b) => ord[a.level] - ord[b.level]); }
const ANN = (typeof ANNOTATIONS !== "undefined") ? ANNOTATIONS : {};
const PASSPORTS = (typeof PASSPORT_DATA !== "undefined") ? PASSPORT_DATA : {};

/* 實測 KPI（來源：analyze_autopass.py / quality_gate.py / cleanliness_score.py / photo_chain.py） */
const OPS = {
  photos: 27367, orders: 4820, recall: 95.5, fpr: 0,
  autoPass: 83.0, alert: 15.6, human: 1.4, gate: 9.2, escalate: 2.8,
  interiorReal: 24, interiorMis: 56, chainCars: 1126, chainScanned: 15, chainHits: 1,
};

const LS_KEY = "irent-review-demo-v1";
let decisions = {};
try { decisions = JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch (e) {}
let filter = "all";
let currentId = null;
let viewMode = "ops";
let currentCar = null;
let passportViz = "3d";
try { passportViz = localStorage.getItem("irent-passport-viz") || "3d"; } catch (e) {}
if (typeof THREE === "undefined") passportViz = "2d";

const LEVEL_META = {
  P1: { label: "P1 即時預警", ico: "⚠" },
  P2: { label: "P2 工單", ico: "◐" },
  P3: { label: "P3 正常", ico: "✓" },
};
const DECISION_META = {
  confirm: { cls: "confirm", ico: "✓", label: "已確認 — 進入索賠／清潔調度，附照片證據鏈" },
  reject:  { cls: "reject",  ico: "✕", label: "已駁回誤報 — 回寫為訓練樣本" },
  retake:  { cls: "retake",  ico: "⟳", label: "已要求補件 — 已推播用戶補拍" },
};

function save() { localStorage.setItem(LS_KEY, JSON.stringify(decisions)); }
function counts() {
  const c = { all: CASES.length, P1: 0, P2: 0, P3: 0, done: 0 };
  for (const cs of CASES) { c[cs.level]++; if (decisions[cs.id]) c.done++; }
  return c;
}

/* ================= 頂部：時鐘 + 分頁 + 進度 ================= */
function tickClock() {
  const el = document.getElementById("clock");
  if (el) el.textContent = new Date().toLocaleTimeString("zh-TW", { hour12: false });
}
setInterval(tickClock, 1000); tickClock();

function renderTabs() {
  document.getElementById("tabs").innerHTML = `
    <button class="tab" role="tab" aria-selected="${viewMode === "ops"}" onclick="setMode('ops')">營運總覽</button>
    <button class="tab" role="tab" aria-selected="${viewMode === "cases"}" onclick="setMode('cases')">案件複核<span class="cnt">${CASES.length}</span></button>
    <button class="tab" role="tab" aria-selected="${viewMode === "passport"}" onclick="setMode('passport')">車輛損傷護照<span class="cnt">${Object.keys(PASSPORTS).length}</span></button>`;
}

function renderStats() {
  const bar = document.getElementById("statsbar");
  if (viewMode !== "cases") { bar.innerHTML = ""; return; }
  const c = counts();
  const pct = Math.round(c.done / c.all * 100);
  bar.innerHTML = `
    <div class="progress">
      <span class="lbl">複核進度</span>
      <div class="track"><div class="fill" style="width:${pct}%"></div></div>
      <span class="pct mono">${c.done}/${c.all}（${pct}%）</span>
    </div>
    <div class="statpills">
      <span class="spill crit"><span class="dot"></span>P1 即時預警 ${c.P1}</span>
      <span class="spill warn"><span class="dot"></span>P2 工單 ${c.P2}</span>
      <span class="spill okp"><span class="dot"></span>P3 正常 ${c.P3}</span>
    </div>`;
}

/* ================= 左欄 ================= */
function renderFilters() {
  const el = document.getElementById("filters");
  if (viewMode !== "cases") { el.innerHTML = ""; return; }
  const c = counts();
  const f2n = CASES.filter(cs => cs.f2).length;
  const defs = [
    ["all", "全部", c.all], ["P1", "P1", c.P1], ["P2", "P2", c.P2], ["P3", "P3", c.P3],
    ["f2", "車內", f2n], ["todo", "未複核", c.all - c.done], ["done", "已複核", c.done],
  ];
  el.innerHTML = defs.map(([k, lbl, n]) =>
    `<button class="chip" aria-pressed="${filter === k}" onclick="setFilter('${k}')">${lbl}<span class="n">${n}</span></button>`).join("");
}

function visible() {
  return CASES.filter(cs => {
    if (filter === "all") return true;
    if (filter === "done") return !!decisions[cs.id];
    if (filter === "todo") return !decisions[cs.id];
    if (filter === "f2") return !!cs.f2;
    return cs.level === filter;
  });
}

function summaryText(cs) {
  const a = cs.assessment;
  if (cs.f2) {
    if (a.level === "髒汙") return "髒汙：" + (a.issues.join("、") || a.reasoning);
    return `${a.level} — ${a.reasoning}`;
  }
  if (!a.angle_match) return "借/還照方位不一致，無法比對";
  if (!a.new_damage_found) return "未發現新增車損";
  return a.damages.map(d => `${d.location}·${d.type}`).join("；");
}

function renderList() {
  if (viewMode === "passport") { renderPassportList(); return; }
  if (viewMode !== "cases") return;
  const vis = visible();
  if (vis.length && !vis.some(cs => cs.id === currentId)) currentId = vis[0].id;
  document.getElementById("list").innerHTML = vis.map(cs => {
    const d = decisions[cs.id];
    const thumb = cs.f2 ? cs.photo : cs.ret;
    return `<button class="item lv-${cs.level.toLowerCase()}" aria-current="${cs.id === currentId}" onclick="selectCase('${cs.id}')">
      <span class="stripe"></span>
      <img class="thumb" src="data:image/jpeg;base64,${thumb}" alt="" loading="lazy">
      <span class="mid">
        <span class="t1"><span class="plate">${cs.car}</span><span class="angle">${cs.angle}</span>
          ${cs.f2 ? `<span class="badge f2tag">車內</span>` : ""}</span>
        <span class="desc">${summaryText(cs)}</span>
      </span>
      <span class="right">
        <span class="badge ${cs.level.toLowerCase()}">${cs.level}</span>
        <span class="state">${d ? DECISION_META[d].ico : ""}</span>
      </span>
    </button>`;
  }).join("") || `<div style="padding:20px;color:var(--muted)">此篩選下沒有案件</div>`;
  scrollCurrentIntoView();
}

function scrollCurrentIntoView() {
  const el = document.querySelector('.item[aria-current="true"]');
  if (el) el.scrollIntoView({ block: "nearest" });
}

/* ================= 標註疊加 ================= */
function confBar(v) {
  return `<div class="conf"><span>信心</span><div class="track"><div class="fill" style="width:${Math.round(v * 100)}%"></div></div><span class="mono">${v.toFixed(2)}</span></div>`;
}
function annBoxes(cs) {
  const a = ANN[cs.id];
  if (!a || !a.findings.length) return "";
  return a.findings.map((f, i) => {
    const [y0, x0, y1, x1] = f.box_2d;
    return `<div class="annbox" id="ab${i}" style="left:${x0 / 10}%;top:${y0 / 10}%;width:${(x1 - x0) / 10}%;height:${(y1 - y0) / 10}%"><span class="n">${i + 1}</span></div>`;
  }).join("");
}
function annRows(cs) {
  const a = ANN[cs.id];
  if (!a || !a.findings.length) return null;
  return a.findings.map((f, i) => `
    <div class="dmg linked" onmouseenter="hotBox(${i},true)" onmouseleave="hotBox(${i},false)">
      <div class="l1"><span class="num">${i + 1}</span>${f.label}<span class="sev ${f.severity}">${f.severity.toUpperCase()}</span></div>
      ${confBar(f.confidence)}
      <div class="why">${f.description}</div>
    </div>`).join("");
}
function hotBox(i, on) {
  const el = document.getElementById("ab" + i);
  if (el) el.classList.toggle("hot", on);
}

/* ================= 同步放大鏡（借/還照同座標比對） ================= */
const ZOOM = 2.3;
function lensMove(e) {
  const wrap = e.currentTarget;
  const zone = wrap.closest(".photos");
  if (!zone) return;
  const img = wrap.querySelector("img");
  const r = img.getBoundingClientRect();
  const fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
  zone.querySelectorAll(".imgwrap.zoomable").forEach(w => {
    const im = w.querySelector("img"), ln = w.querySelector(".lens");
    if (!im || !ln) return;
    const rw = im.clientWidth, rh = im.clientHeight;
    const lw = ln.offsetWidth, lh = ln.offsetHeight;
    const cx = fx * rw, cy = fy * rh;
    ln.style.display = "block";
    ln.style.left = (cx - lw / 2) + "px";
    ln.style.top = (cy - lh / 2) + "px";
    ln.style.backgroundImage = `url("${im.src}")`;
    ln.style.backgroundSize = (rw * ZOOM) + "px " + (rh * ZOOM) + "px";
    ln.style.backgroundPosition = (-(cx * ZOOM - lw / 2)) + "px " + (-(cy * ZOOM - lh / 2)) + "px";
  });
}
function lensLeave(e) {
  const zone = e.currentTarget.closest(".photos");
  if (zone) zone.querySelectorAll(".lens").forEach(l => l.style.display = "none");
}
function armLens() {
  if (window.matchMedia && window.matchMedia("(pointer: coarse)").matches) return;
  document.querySelectorAll(".photos .imgwrap.zoomable").forEach(w => {
    if (!w.querySelector(".lens")) {
      const l = document.createElement("div"); l.className = "lens"; w.appendChild(l);
    }
    w.onmousemove = lensMove; w.onmouseleave = lensLeave;
  });
}

/* ================= 詳情：案件 ================= */
function actionArea(cs) {
  const d = decisions[cs.id];
  if (d) {
    return `<div class="decided ${DECISION_META[d].cls}"><span>${DECISION_META[d].ico} ${DECISION_META[d].label}</span>
      <button class="undo" onclick="undoDecision('${cs.id}')">復原</button></div>`;
  }
  const confirmLbl = cs.f2 ? "✓ 確認髒汙，派遣清潔" : "✓ 確認車損，進入索賠";
  return `<div class="actions">
    <button class="btn danger" onclick="decide('${cs.id}','confirm')">${confirmLbl}</button>
    <button class="btn" onclick="decide('${cs.id}','reject')">✕ 駁回誤報</button>
    <button class="btn" onclick="decide('${cs.id}','retake')">⟳ 要求補件</button>
  </div>`;
}

function renderDetail() {
  if (viewMode === "ops") { renderOps(); return; }
  if (viewMode === "passport") { renderPassportDetail(); return; }
  const cs = CASES.find(c => c.id === currentId);
  const el = document.getElementById("detail");
  if (!cs) { el.innerHTML = ""; return; }
  if (cs.f2) { renderF2Detail(el, cs); return; }

  const a = cs.assessment;
  let head, sub;
  if (!a.angle_match) {
    head = `<h3 class="warn"><span class="ico">◐</span>無法有效比對</h3>`;
    sub = "兩張照片非同一方位或損傷部位未入鏡 — 建議要求補件，並於 App 端加入拍攝即時檢核。";
  } else if (a.new_damage_found) {
    head = `<h3 class="crit"><span class="ico">⚠</span>偵測到新增車損</h3>`;
    sub = "以下損傷存在於還車照、但借車照對應位置無此痕跡：";
  } else {
    head = `<h3 class="ok"><span class="ico">✓</span>未發現新增車損</h3>`;
    sub = "借/還照比對一致，本案自動記錄。";
  }
  const dmgs = annRows(cs) ?? a.damages.map(d => `
    <div class="dmg">
      <div class="l1">${d.location} · ${d.type}<span class="sev ${d.severity}">${d.severity.toUpperCase()}</span></div>
      ${confBar(d.confidence)}
      <div class="why">${d.reasoning}</div>
    </div>`).join("");
  const pre = a.pre_existing_notes ? `<div class="note"><b>既有舊損備註：</b>${a.pre_existing_notes}（兩照皆存在，不列入本次求償）</div>` : "";
  const truthLbl = cs.truth === "claimed" ? "資料集標註：實際有索賠" : "資料集標註：當時未索賠";
  const annN = ANN[cs.id] && ANN[cs.id].findings.length;

  el.innerHTML = `
    <div class="d-card d-head">
      <span class="plate">${cs.car}</span><span class="angle">${cs.angle}</span>
      <span class="badge ${cs.level.toLowerCase()}">${LEVEL_META[cs.level].ico} ${LEVEL_META[cs.level].label}</span>
      <span class="badge soft">${truthLbl}</span>
      <span class="spacer"></span>
      ${actionArea(cs)}
    </div>
    <div class="photos">
      <div class="photo d-card"><div class="cap"><span class="before">借車照</span><span class="t">比對基準</span></div>
        <div class="imgwrap zoomable"><img src="data:image/jpeg;base64,${cs.pickup}" alt="${cs.car} ${cs.angle} 借車照"></div>
        <div class="zoom-hint">滑過照片 → 借/還同座標放大鏡</div></div>
      <div class="photo d-card"><div class="cap"><span class="after">還車照</span><span class="t">${annN ? "AI 標註 " + annN + " 處" : "本次判定"}</span></div>
        <div class="imgwrap zoomable"><img src="data:image/jpeg;base64,${cs.ret}" alt="${cs.car} ${cs.angle} 還車照">${annBoxes(cs)}</div></div>
    </div>
    <div class="d-card verdict">${head}<div class="v-sub">${sub}</div>${dmgs}${pre}</div>`;
  armLens();
}

function renderF2Detail(el, cs) {
  const a = cs.assessment;
  let head, sub;
  if (a.level === "髒汙") {
    head = `<h3 class="crit"><span class="ico">⚠</span>髒汙 — 須立即清潔</h3>`;
    sub = "建議：該車暫停派單，通知清潔調度優先處理。";
  } else if (cs.kind === "分類錯置") {
    head = `<h3 class="warn"><span class="ico">◐</span>非車內照，無法判定</h3>`;
    sub = "車內照欄位混入其他照片（上傳分類錯置）— 建議走補件流程。";
  } else {
    head = `<h3 class="ok"><span class="ico">✓</span>${a.level}</h3>`;
    sub = a.level === "乾淨" ? "狀態良好，可回饋用戶信譽加分。" : "輕微使用痕跡，納入清潔排程權重。";
  }
  const issues = annRows(cs) ?? (a.issues && a.issues.length
    ? `<div class="dmg"><div class="l1">觀察到的問題</div><div class="why">${a.issues.join("、")}</div></div>` : "");
  const review = a.reviewed
    ? `<div class="note"><b>級聯複核：</b>Flash 初判「${a.flash_level || a.level}」→ Pro 複核「${a.level}」${a.flash_level && a.flash_level !== a.level ? "（翻轉）" : "（維持）"}</div>` : "";
  const annN = ANN[cs.id] && ANN[cs.id].findings.length;
  let scoreHtml = "";
  if (typeof a.score === "number") {
    const col = a.score >= 85 ? "var(--ok)" : a.score >= 60 ? "var(--amber)" : "var(--red)";
    const items = (a.score_items || []).map(it =>
      `<div style="display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:2px 0">
        <span>${it.category}（${it.extent}）<span style="color:var(--muted)">${it.note || ""}</span></span>
        <span style="color:var(--red);font-weight:700;white-space:nowrap" class="mono">−${it.deduction}</span></div>`).join("");
    scoreHtml = `<div class="dmg">
      <div class="l1" style="display:flex;align-items:baseline;gap:8px">Cleanliness Score
        <span class="mono" style="font-size:24px;font-weight:800;color:${col}">${a.score}</span><span style="color:var(--muted);font-size:12px">/ 100</span></div>
      <div style="height:6px;border-radius:2px;background:var(--panel3);overflow:hidden;margin:6px 0 8px">
        <div style="height:100%;width:${a.score}%;background:${col}"></div></div>
      ${items || `<div style="font-size:12.5px;color:var(--muted)">無扣分項</div>`}
      <div style="font-size:11.5px;color:var(--faint);margin-top:6px">計分方式：AI 盤點問題（固定 11 類 × 3 級程度）→ 程式端加權扣分，權重公開可調</div>
      ${(a.score >= 85 && a.level === "髒汙") ? `<div style="font-size:11.5px;color:var(--amber);margin-top:4px">計分制與級聯判定不一致（輕微遺留物裁量）——此類邊界案例正是權重依營運政策調整的空間</div>` : ""}
    </div>`;
  }

  el.innerHTML = `
    <div class="d-card d-head">
      <span class="plate">${cs.car}</span><span class="angle">${cs.angle}</span>
      <span class="badge ${cs.level.toLowerCase()}">${LEVEL_META[cs.level].ico} ${LEVEL_META[cs.level].label}</span>
      <span class="badge f2tag">F2 車內整潔分級</span>
      <span class="spacer"></span>
      ${actionArea(cs)}
    </div>
    <div class="photos" style="grid-template-columns:1fr;max-width:560px">
      <div class="photo d-card"><div class="cap"><span class="after">還車車內照</span><span class="t">${annN ? "AI 標註 " + annN + " 處" : "單照判讀"}</span></div>
        <div class="imgwrap"><img src="data:image/jpeg;base64,${cs.photo}" alt="${cs.car} ${cs.angle} 車內照">${annBoxes(cs)}</div></div>
    </div>
    <div class="d-card verdict">${head}<div class="v-sub">${sub}</div>${confBar(a.confidence)}${scoreHtml}${issues}
      <div class="dmg"><div class="why">${a.reasoning}</div></div>${review}</div>`;
}

/* ================= 營運總覽 ================= */
let opsAnimated = false;
function countUp(el, target, decimals, suffix) {
  const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduced || opsAnimated) { el.textContent = target.toLocaleString("en-US", { minimumFractionDigits: decimals, maximumFractionDigits: decimals }) + (suffix || ""); return; }
  const t0 = performance.now(), dur = 900;
  (function step(t) {
    const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    el.textContent = (target * e).toLocaleString("en-US", { minimumFractionDigits: decimals, maximumFractionDigits: decimals }) + (suffix || "");
    if (p < 1) requestAnimationFrame(step);
  })(t0);
}

function flowSvg() {
  /* 判讀流水線：節點寬 150、線寬 ∝ 流量 */
  const Y = 92;
  return `<div class="flow-wrap"><svg class="flow-svg" viewBox="0 0 940 226" role="img" aria-label="AI 判讀流水線：上傳照片經品質檢核、快篩、級聯複核後自動分流">
    <!-- 節點 -->
    <g>

/* ================= 3D 車（Three.js，內嵌無外連） ================= */
let T3 = null;

function roundedShape(w, l, r) {
  const s = new THREE.Shape(), hw = w / 2, hl = l / 2;
  s.moveTo(-hw + r, -hl);
  s.lineTo(hw - r, -hl); s.quadraticCurveTo(hw, -hl, hw, -hl + r);
  s.lineTo(hw, hl - r); s.quadraticCurveTo(hw, hl, hw - r, hl);
  s.lineTo(-hw + r, hl); s.quadraticCurveTo(-hw, hl, -hw, hl - r);
  s.lineTo(-hw, -hl + r); s.quadraticCurveTo(-hw, -hl, -hw + r, -hl);
  return s;
}
function extrudeRounded(w, l, h, r, bevel) {
  const g = new THREE.ExtrudeGeometry(roundedShape(w, l, r), {
    depth: h, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 3, curveSegments: 12,
  });
  g.rotateX(-Math.PI / 2);
  return g;
}

function buildCar() {
  const car = new THREE.Group();
  const paint = new THREE.MeshStandardMaterial({ color: 0xf2f4f2, roughness: 0.32, metalness: 0.18 });
  const glass = new THREE.MeshStandardMaterial({ color: 0x1d2b26, roughness: 0.12, metalness: 0.65 });
  const dark = new THREE.MeshStandardMaterial({ color: 0x2b302d, roughness: 0.85 });
  const hubM = new THREE.MeshStandardMaterial({ color: 0x9aa5a0, roughness: 0.35, metalness: 0.6 });

  const body = new THREE.Mesh(extrudeRounded(1.62, 4.0, 0.36, 0.5, 0.1), paint);
  body.position.y = 0.3; car.add(body);
  const skirt = new THREE.Mesh(extrudeRounded(1.56, 3.9, 0.1, 0.48, 0.05), dark);
  skirt.position.y = 0.22; car.add(skirt);
  const cabin = new THREE.Mesh(extrudeRounded(1.34, 2.05, 0.3, 0.5, 0.13), glass);
  cabin.position.set(0, 0.78, -0.18); car.add(cabin);
  const roof = new THREE.Mesh(extrudeRounded(1.16, 1.6, 0.05, 0.42, 0.06), paint);
  roof.position.set(0, 1.13, -0.18); car.add(roof);

  const wheelG = new THREE.CylinderGeometry(0.335, 0.335, 0.24, 24);
  wheelG.rotateZ(Math.PI / 2);
  const hubG = new THREE.CylinderGeometry(0.17, 0.17, 0.26, 16);
  hubG.rotateZ(Math.PI / 2);
  for (const [x, z] of [[-0.78, 1.28], [0.78, 1.28], [-0.78, -1.28], [0.78, -1.28]]) {
    const w = new THREE.Mesh(wheelG, dark); w.position.set(x, 0.335, z); car.add(w);
    const h = new THREE.Mesh(hubG, hubM); h.position.set(x, 0.335, z); car.add(h);
  }
  const lampG = new THREE.BoxGeometry(0.36, 0.09, 0.06);
  const lampM = new THREE.MeshStandardMaterial({ color: 0xfff6d8, emissive: 0xffedb0, emissiveIntensity: 0.9 });
  const tailM = new THREE.MeshStandardMaterial({ color: 0xd7423c, emissive: 0xc03530, emissiveIntensity: 0.8 });
  for (const x of [-0.48, 0.48]) {
    const hl = new THREE.Mesh(lampG, lampM); hl.position.set(x, 0.5, 2.0); car.add(hl);
    const tl = new THREE.Mesh(lampG, tailM); tl.position.set(x, 0.5, -2.0); car.add(tl);
  }
  return car;
}

function markerTexture(num, color) {
  const c = document.createElement("canvas"); c.width = c.height = 96;

  x.beginPath(); x.arc(48, 48, 40, 0, 7); x.fillStyle = color; x.fill();

  x.fillStyle = "#fff"; x.font = "800 40px ui-monospace, Menlo, monospace";
  x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(num, 48, 51);
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4;
  return t;
}

const ZONE3D = { "左前": [-1.02, 1.15], "右前": [1.02, 1.15], "左後": [-1.02, -1.05], "右後": [1.02, -1.05] };

function initThree() {
  if (T3) return true;
  if (typeof THREE === "undefined") return false;
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  } catch (e) { return false; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(30, 1.18, 0.1, 60);
  camera.position.set(4.4, 3.0, 5.4); camera.lookAt(0, 0.35, 0);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x5c6b62, 1.0));
  const dir = new THREE.DirectionalLight(0xffffff, 0.65); dir.position.set(3, 6, 4); scene.add(dir);
  const rim = new THREE.DirectionalLight(0xa8e2c6, 0.3); rim.position.set(-4, 2, -3); scene.add(rim);

  const root = new THREE.Group(); scene.add(root);
  root.add(buildCar());
  const shadow = new THREE.Mesh(new THREE.CircleGeometry(1, 40),
    new THREE.MeshBasicMaterial({ color: 0x10241a, transparent: true, opacity: 0.16, depthWrite: false }));
  shadow.scale.set(1.35, 2.5, 1); shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.005;
  root.add(shadow);
  const markers = new THREE.Group(); root.add(markers);

  const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  T3 = { renderer, scene, camera, root, markers, rotY: 0.55, targetY: 0.55, rotX: 0.0, targetX: 0.0,
         auto: !reduced, lastTouch: 0, hovered: -1, ray: new THREE.Raycaster(), ptr: new THREE.Vector2() };

  const el = renderer.domElement;
  let dragging = false, px = 0, py = 0;
  el.addEventListener("pointerdown", e => { dragging = true; px = e.clientX; py = e.clientY; T3.lastTouch = Date.now(); el.setPointerCapture(e.pointerId); });
  el.addEventListener("pointerup", () => { dragging = false; });
  el.addEventListener("pointermove", e => {
    T3.lastTouch = Date.now();
    if (dragging) {
      T3.targetY += (e.clientX - px) * 0.009;
      T3.targetX = Math.max(-0.15, Math.min(0.55, T3.targetX + (e.clientY - py) * 0.005));
      px = e.clientX; py = e.clientY;
    } else {
      const r = el.getBoundingClientRect();
      T3.ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
      T3.ray.setFromCamera(T3.ptr, T3.camera);
      const hit = T3.ray.intersectObjects(T3.markers.children)[0];
      const idx = hit ? hit.object.userData.idx : -1;
      if (idx !== T3.hovered) {
        if (T3.hovered >= 0) hotRec(T3.hovered, false);
        if (idx >= 0) hotRec(idx, true);
        T3.hovered = idx;
        el.style.cursor = idx >= 0 ? "pointer" : "grab";
      }
    }
  });
  el.addEventListener("pointerleave", () => { if (T3.hovered >= 0) { hotRec(T3.hovered, false); T3.hovered = -1; } });

  (function loop() {
    requestAnimationFrame(loop);
    if (!T3.renderer.domElement.isConnected) return;   // 本幀跳過（RAF 已排下一幀）
    if (T3.auto && Date.now() - T3.lastTouch > 2600) T3.targetY += 0.0035;
    T3.rotY += (T3.targetY - T3.rotY) * 0.12;
    T3.rotX += (T3.targetX - T3.rotX) * 0.12;
    T3.root.rotation.y = T3.rotY;
    T3.root.rotation.x = T3.rotX * 0.4;
    T3.renderer.render(T3.scene, T3.camera);
  })();
  return true;
}

function mount3D(p) {
  const box = document.getElementById("carviz");
  if (!box) return;
  if (!initThree()) { passportViz = "2d"; box.innerHTML = carSvg(p); return; }
  // 重建標記
  T3.markers.children.slice().forEach(m => { T3.markers.remove(m); if (m.material.map) m.material.map.dispose(); m.material.dispose(); });
  const zoneCount = {};
  p.records.forEach((r, i) => {
    if (!ZONE3D[r.angle]) return;
    const n = zoneCount[r.angle] = (zoneCount[r.angle] || 0) + 1;
    const [x, z] = ZONE3D[r.angle];
    const isNew = r.kind === "new";
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({
      map: markerTexture(String(parseInt(r.id.slice(2), 10)), isNew ? "#FF6C5E" : "#6b7770"),
      depthTest: false, transparent: true,
    }));
    sp.scale.set(0.42, 0.42, 1);
    sp.position.set(x, 0.62 + (n - 1) * 0.42, z * (1 - (n - 1) * 0.12));
    sp.userData.idx = i;
    T3.markers.add(sp);
  });
  const w = Math.min(box.clientWidth || 330, 340), h = Math.round(w * 0.85);
  T3.renderer.setSize(w, h);
  T3.camera.aspect = w / h; T3.camera.updateProjectionMatrix();
  box.innerHTML = ""; box.appendChild(T3.renderer.domElement);
  T3.lastTouch = 0;
}

function renderPassportDetail() {
  const el = document.getElementById("detail");
  const p = PASSPORTS[currentCar];
  if (!p) { el.innerHTML = ""; return; }
  const recs = p.records.map((r, i) => `
    <div class="rec" id="rec${i}" onmouseenter="hotRec(${i},true)" onmouseleave="hotRec(${i},false)">
      <div class="l1"><span class="dmg num" style="display:inline-flex;width:20px;height:20px;border-radius:50%;color:var(--bg);font-size:11.5px;font-weight:800;align-items:center;justify-content:center;background:${r.kind === "new" ? "var(--red)" : "var(--faint)"}">${r.id.slice(2)}</span>
        ${r.angle}・${r.location}
        <span class="badge ${r.kind === "new" ? "p1" : "soft"}">${r.kind === "new" ? r.type + "・" + r.severity : "既有損"}</span>
        ${r.verified ? `<span class="badge p3">✓ 人工已複驗</span>` : ""}</div>
      <div class="meta">首次發現：<b>${r.first_seen.order}</b>（${r.first_seen.time}）　責任歸屬：<b>${r.liable_order}</b>
        ${CASES.some(c => c.id === r.evidence_case) ? `　<a class="evlink" onclick="jumpToCase('${r.evidence_case}')">查看證據照 →</a>` : ""}</div>
    </div>`).join("");
  const orders = Object.entries(p.real_orders || {});
  const orderHtml = orders.length
    ? `<div class="orders">此車觀測期內真實訂單：${orders.sort((a, b) => a[1].localeCompare(b[1])).map(([o, t]) => `<span class="mono">#${o}</span>（${t}）`).join("、")}</div>` : "";
  el.innerHTML = `
    <div class="d-card d-head">
      <span class="plate">${currentCar}</span>
      <span class="badge p1">開放新損 ${p.open_new}</span>
      <span class="badge soft">既有損登錄 ${p.pre_existing}</span>
      <span class="spacer"></span>
      <span class="badge f2tag">損傷護照 DEMO</span>
    </div>
    <div class="d-card p-layout">
      <div class="p-map">
        <div class="viz-toggle">
          <button aria-pressed="${passportViz === "3d"}" onclick="setViz('3d')">3D 檢視</button>
          <button aria-pressed="${passportViz === "2d"}" onclick="setViz('2d')">2D 展開圖</button>
        </div>
        <div id="carviz">${passportViz === "2d" ? carSvg(p) : ""}</div>
        ${passportViz === "3d" ? `<div class="viz-hint">拖曳旋轉 · 閒置自動展示 · 滑過紅點看紀錄</div>` : ""}
      </div>
      <div class="p-recs">
        <div style="font-weight:800;font-size:14px;margin-bottom:2px">損傷紀錄<span style="color:var(--muted);font-weight:600;font-size:12px">（與左圖圓點連動）</span></div>
        ${recs}${orderHtml}
      </div>
    </div>
    ${partTable(p)}
    <div class="d-card verdict"><div class="note" style="margin:0"><b>護照機制：</b>每筆還車判定自動歸戶到車輛；判定時附上護照讓 AI 專注找「護照之外的新東西」——實驗證實既有損登錄後仍能 3/3 票抓到新增大損（RCR-7661），並使新舊難分案例的判定從翻轉不定變為穩定（RDH-3092）。維修完成後由客服關閉紀錄。</div></div>`;
  if (passportViz === "3d") mount3D(p);
}

const SEV_TXT = { low: "低", medium: "中", high: "高" };

function partTable(p) {
  const tagged = p.records.filter(r => r.part);
  if (!tagged.length) return "";
  const rows = tagged.map(r => `
    <tr>
      <td style="font-weight:700">${r.part}</td>
      <td>${r.kind === "new" ? r.type : r.type + "（登錄）"}</td>
      <td>${r.kind === "new" ? (SEV_TXT[r.severity] || r.severity) : "—"}</td>
      <td>${r.kind === "new" ? `<span class="badge p1">NEW</span>` : `<span class="badge soft">既有</span>`}</td>
      <td style="color:var(--muted)">${r.liable_order}</td>
    </tr>`).join("");
  return `<div class="d-card" style="padding:13px 16px">
    <div style="font-weight:800;font-size:14px;margin-bottom:8px">部位總覽<span style="color:var(--muted);font-weight:600;font-size:12px">（AI 部位定位，固定 17 類）</span></div>
    <div style="overflow-x:auto"><table class="parts-table">
      <thead><tr><th>部位</th><th>異常</th><th>嚴重度</th><th>新舊</th><th>責任歸屬</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;
}

function setViz(v) {
  passportViz = v;
  try { localStorage.setItem("irent-passport-viz", v); } catch (e) {}
  renderPassportDetail();
}

function jumpToCase(id) { viewMode = "cases"; filter = "all"; currentId = id; renderAll(); }

/* ================= 事件 ================= */
function renderAll() {
  document.getElementById("main").classList.toggle("full", viewMode === "ops");
  renderTabs(); renderStats(); renderFilters(); renderList(); renderDetail();
}
function setMode(m) {
  viewMode = m;
  if (m === "passport" && !currentCar) currentCar = null;
  renderAll();
}
function setFilter(f) { viewMode = "cases"; filter = f; renderAll(); }
function selectCase(id) { currentId = id; renderList(); renderDetail(); }
function decide(id, kind) { decisions[id] = kind; save(); advance(id); renderAll(); }
function undoDecision(id) { delete decisions[id]; save(); renderAll(); }
function advance(id) {
  const vis = visible();
  const i = vis.findIndex(c => c.id === id);
  const next = vis.slice(i + 1).find(c => !decisions[c.id]) || vis.find(c => !decisions[c.id]);
  if (next) currentId = next.id;
}
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (viewMode === "ops") return;
  if (viewMode === "passport") {
    const cars = Object.keys(PASSPORTS).sort((a, b) => PASSPORTS[b].open_new - PASSPORTS[a].open_new || a.localeCompare(b));
    const ci = cars.indexOf(currentCar);
    if (e.key === "ArrowDown" && ci < cars.length - 1) { currentCar = cars[ci + 1]; renderList(); renderDetail(); e.preventDefault(); }
    else if (e.key === "ArrowUp" && ci > 0) { currentCar = cars[ci - 1]; renderList(); renderDetail(); e.preventDefault(); }
    return;
  }
  const vis = visible();
  const i = vis.findIndex(c => c.id === currentId);
  if (e.key === "ArrowDown" && i < vis.length - 1) { currentId = vis[i + 1].id; renderList(); renderDetail(); e.preventDefault(); }
  else if (e.key === "ArrowUp" && i > 0) { currentId = vis[i - 1].id; renderList(); renderDetail(); e.preventDefault(); }
  else if (e.key === "1" && currentId && !decisions[currentId]) decide(currentId, "confirm");
  else if (e.key === "2" && currentId && !decisions[currentId]) decide(currentId, "reject");
  else if (e.key === "3" && currentId && !decisions[currentId]) decide(currentId, "retake");
});
renderAll();
</script>
