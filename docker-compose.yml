# 在專案根目錄執行：docker compose up --build -d
# .env 只在執行時注入 backend，不會複製進 image。
# 此配置供本機／內網使用；對外部署需另設 HTTPS 與完整存取控制。

services:
  backend:
    image: cyh032508/irent-backend:v1
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      # 保留給 iOS App 直接存取後端。
      - "${IRENT_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      IRENT_DATASET_ROOT: /dataset
      IRENT_DB_PATH: /data/decisions.sqlite3
      IRENT_UPLOAD_DIR: /data/uploads
      IRENT_SCRATCH_DIR: /data/scratch
      IRENT_LIVE_SIGNALS: /data/shadow_signals_live.jsonl
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost:3000}"
    volumes:
      - backend_data:/data
      - type: bind
        source: "./iRent - 運用 AI 打造 iRent 智能車況管家：優化租還車體驗與營運效率"
        target: /dataset
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    # 背景 AI 判讀使用 process 內的 thread 與鎖，目前只能跑一個實例。
    deploy:
      replicas: 1

  fleet-ops-center:
    image: cyh032508/irent-fleet-ops-center:v1
    build:
      context: .
      dockerfile: fleet-ops-center/Dockerfile
    ports:
      - "${IRENT_FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/ops/"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

volumes:
  # 沿用原有名稱；同一 Compose project 下可保留原本 SQLite 與上傳資料。
  backend_data:
